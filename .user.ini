; Configuración PHP a nivel de carpeta para Sistema Liberia.
; Bluehost respeta este archivo en hosts con PHP-FPM/CGI-FastCGI.

; Tiempo de vida de sesiones — debe ser mayor o igual al timeout de inactividad
; que controla session_helper.php (3600s = 1 hora). Le ponemos 7200 (2h) para
; tener margen y que el helper sea quien controle la expiración real.
session.gc_maxlifetime = 7200

; Cookie de sesión: 0 = vive hasta que el usuario cierre el navegador.
session.cookie_lifetime = 0

; Modo estricto: rechaza IDs de sesión no inicializados por el servidor.
session.use_strict_mode = 1
