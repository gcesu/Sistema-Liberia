    <!-- VERIFICACIÓN DE SESIÓN -->
    <script>
        (async function checkAuth() {
            const token = sessionStorage.getItem('session_token');
            if (!token) { window.location.href = '/login'; return; }
            try {
                const response = await fetch('api/check_session.php', { headers: { 'X-Session-Token': token } });
                const data = await response.json();
                if (!data.authenticated) { sessionStorage.removeItem('session_token'); window.location.href = '/login'; return; }
                if (!data.is_admin && data.permisos && !data.permisos.contabilidad) {
                    const pages = ['cotizaciones','reservas','viajes','choferes','contabilidad'];
                    const allowed = pages.find(p => data.permisos[p]);
                    window.location.href = '/' + (allowed || 'login'); return;
                }
            } catch (error) { console.error('Error verificando sesión:', error); window.location.href = '/login'; }
        })();
    </script>

            thead tr {
                position: absolute;
                top: -9999px;

            }

            tfoot {

                margin-top: 16px;

            tfoot td {

                justify-content: space-between;
                padding: 10px 16px !important;

            tbody tr {
                margin-bottom: 12px;
                border: 1px solid #e2e8f0;
                border-radius: 10px;
                padding: 16px;
                background: white;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);

                border: none;
                padding: 6px 0 !important;
                display: flex;
                justify-content: space-between;
                align-items: center;
                border-bottom: 1px dashed #f1f5f9;
            }

            td:first-child {
                border-bottom: 1px solid #e2e8f0;
                padding-bottom: 10px !important;
                margin-bottom: 6px;
            }

            td:last-child {
                border-bottom: none;
            }

            td:before {
                content: attr(data-label);
                font-weight: 800;
                text-transform: uppercase;
                font-size: var(--font-xxxs);
                color: #94a3b8;
                min-width: 80px;
                flex-shrink: 0;
            }
        }
    </style>
</head>

                <button class="btn-open-sidebar" id="btn-open-sidebar" onclick="toggleSidebar()"
                    title="Mostrar panel">☰</button>

                <h2 id="driver-title" class="title-font text-xl text-primary" style="color: var(--primary); margin: 0;">
                    Seleccione un chofer
                </h2>

                <div class="month-selector" style="margin-left: auto;">
                    <button class="month-btn" onclick="changeMonth(-1)">◀</button>
                    <input type="month" id="month-input" class="month-input" onchange="loadData()">
                    <button class="month-btn" onclick="changeMonth(1)">▶</button>
                </div>
            </div>

            <!-- Stats cards -->
            <div class="stats-grid" id="stats-grid" style="display: none;">
                <div class="stat-card">
                    <div class="stat-label">Viajes</div>
                    <div class="stat-value" id="stat-viajes">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Subtotal</div>
                    <div class="stat-value blue" id="stat-subtotal">$0</div>
                </div>
                <div class="stat-card" id="stat-paypal-card" style="display: none;">
                    <div class="stat-label">PayPal</div>
                    <div class="stat-value blue" id="stat-paypal">$0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Comisión Total</div>
                    <div class="stat-value green" id="stat-comision">$0</div>
                </div>
                <div class="stat-card" id="stat-ledebo-card" style="display: none;">
                    <div class="stat-label">Le Debo</div>
                    <div class="stat-value amber" id="stat-ledebo">$0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Pendiente</div>
                    <div class="stat-value amber" id="stat-pendiente">$0</div>
                </div>
            </div>

            <!-- Table -->
            <div id="table-container">
                <div class="empty-state" id="empty-state">
                    <div class="empty-state-icon">📊</div>
                    <div class="empty-state-title">Contabilidad de Choferes</div>
                    <div class="empty-state-text">Seleccione un chofer del panel lateral para ver su contabilidad
                        mensual</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allDrivers = [];
        let currentDriver = null;
        let currentViajes = [];
        let currentChoferInfo = null;

        // ═══ Inicialización ═══
        document.addEventListener('DOMContentLoaded', async () => {
            // Mes actual por defecto
            const now = new Date();
            document.getElementById('month-input').value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;

            await loadDrivers();
        });

        // ═══ Cargar choferes ═══
        async function loadDrivers() {
            try {
                const response = await fetch('api/choferes.php');
                if (!response.ok) throw new Error('Error cargando choferes');
                const data = await response.json();

                // Solo choferes con comision_tipo asignado
                allDrivers = data.filter(c => c.comision_tipo !== null && c.comision_tipo !== '');

                renderDriverList();
                renderMobileSelect();
            } catch (err) {
                console.error('Error cargando choferes:', err);
            }
        }

        // ═══ Render sidebar ═══
        function renderDriverList() {
            const container = document.getElementById('driver-list');
            container.innerHTML = allDrivers.map(d => {
                const initials = d.nombre.replace(/\s*\(.*?\)\s*/g, '').trim().split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase();
                const tipo = d.comision_tipo;
                const tipoLabel = tipo === 'porcentaje' ? `${parseFloat(d.comision_porcentaje)}%` : 'Neto';
                const isActive = currentDriver === d.nombre ? 'active' : '';

                return `
                    <div class="driver-item ${isActive}" onclick="selectDriver('${d.nombre.replace(/'/g, "\\'")}')">
                        <div class="driver-avatar ${tipo}">${initials}</div>
                        <div>
                            <div class="driver-name">${d.nombre}</div>
                            <div class="driver-type ${tipo}">${tipoLabel}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ═══ Render mobile select ═══
        function renderMobileSelect() {
            const select = document.getElementById('mobile-chofer-select');
            const options = allDrivers.map(d => {
                const tipoLabel = d.comision_tipo === 'porcentaje' ? `${parseFloat(d.comision_porcentaje)}%` : 'Neto';
                const selected = currentDriver === d.nombre ? 'selected' : '';
                return `<option value="${d.nombre}" ${selected}>${d.nombre} (${tipoLabel})</option>`;
            }).join('');
            select.innerHTML = '<option value="">— Seleccionar chofer —</option>' + options;
        }

        function selectDriverFromMobile() {
            const select = document.getElementById('mobile-chofer-select');
            if (select.value) selectDriver(select.value);
        }

        // ═══ Seleccionar chofer ═══
        function selectDriver(nombre) {
            currentDriver = nombre;
            renderDriverList();
            renderMobileSelect();

            const driver = allDrivers.find(d => d.nombre === nombre);
            const cleanName = nombre.replace(/\s*\(.*?\)\s*/g, '').trim();
            const tipoLabel = driver?.comision_tipo === 'porcentaje'
                ? `Comisión ${parseFloat(driver.comision_porcentaje)}%`
                : 'Precio Neto';

            document.getElementById('driver-title').innerHTML = `
                ${cleanName}
                <span style="font-size: 13px; color: #64748b; font-family: Lato; text-transform: none; letter-spacing: 0;">— ${tipoLabel}</span>
                <button onclick="openComisionModal()" title="Editar tipo de comisión"
                    style="margin-left:8px; background:none; border:1px solid #cbd5e1; border-radius:6px;
                           padding:2px 9px; font-size:11px; cursor:pointer; color:#64748b;
                           font-family:Lato,sans-serif; text-transform:none; letter-spacing:0;
                           vertical-align:middle; transition:all 0.15s;"
                    onmouseover="this.style.borderColor='#002a3f';this.style.color='#002a3f'"
                    onmouseout="this.style.borderColor='#cbd5e1';this.style.color='#64748b'">
                    ✏️ editar
                </button>
            `;

            loadData();
        }

        // ═══ Control de mes ═══
        function changeMonth(delta) {
            const input = document.getElementById('month-input');
            const [year, month] = input.value.split('-').map(Number);
            const d = new Date(year, month - 1 + delta, 1);
            input.value = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
            loadData();
        }

        // ═══ Cargar datos ═══
        async function loadData() {
            if (!currentDriver) return;

            const mes = document.getElementById('month-input').value;
            if (!mes) return;

            try {
                const response = await fetch(`api/contabilidad_api.php?chofer=${encodeURIComponent(currentDriver)}&mes=${mes}`);
                if (!response.ok) throw new Error('Error cargando datos');
                const data = await response.json();

                currentChoferInfo = data.chofer;
                currentViajes = data.viajes;

                renderTable();
                updateStats();

                document.getElementById('stats-grid').style.display = 'grid';
                document.getElementById('empty-state')?.remove();
            } catch (err) {
                console.error('Error cargando contabilidad:', err);
            }
        }

        // ═══ Render table ═══
        function renderTable() {
            const container = document.getElementById('table-container');
            const showNeto = currentChoferInfo?.comision_tipo === 'neto';
            const showPaypal = currentChoferInfo?.comision_tipo === 'porcentaje';

            if (currentViajes.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <div class="empty-state-title">Sin viajes</div>
                        <div class="empty-state-text">No se encontraron viajes para este chofer en el mes seleccionado</div>
                    </div>
                `;
                return;
            }

            let html = `
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>✓</th>
                                <th>#</th>
                                <th>Cliente</th>
                                <th>Fecha</th>
                                <th>Recogida</th>
                                <th>Destino</th>
                                <th>Subtotal</th>
                                ${showPaypal ? '<th>PayPal</th>' : '<th>Método</th>'}
                                ${showNeto ? '<th>Neto</th>' : ''}
                                <th>Comisión</th>
                                <th style="width: 44px;"></th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            currentViajes.forEach(v => {
                const paidClass = v.pagado ? 'paid' : '';
                const checked = v.pagado ? 'checked' : '';
                const fechaFormatted = formatDateShort(v.fecha);
                // Recogida = origen, Destino = destino final
                const recogida = v.tipo === 'llegada' ? 'Aeropuerto LIR' : v.destino;
                const destino = v.tipo === 'llegada' ? v.destino : 'Aeropuerto LIR';
                const methodClass = getMethodClass(v.metodo_pago);
                const methodLabel = getMethodLabel(v.metodo_pago);

                html += `
                    <tr class="${paidClass}" id="row-${v.id}">
                        <td data-label="Pagado">
                            <input type="checkbox" class="checkbox-paid" ${checked}
                                onchange="togglePagado(${v.id}, this.checked)">
                        </td>
                        <td data-label="Reserva">
                            <span style="font-weight: 800; color: var(--primary);">${formatOrderId(v.reserva_id)}</span>
                        </td>
                        <td data-label="Cliente"><span style="font-weight: 700;">${v.cliente_nombre}</span></td>
                        <td data-label="Fecha"><span style="font-weight: 700;">${fechaFormatted}</span></td>
                        <td data-label="Recogida">${recogida}</td>
                        <td data-label="Destino">${destino}</td>
                        <td data-label="Subtotal"><span class="money">$${v.subtotal.toFixed(2)}</span></td>
                        ${showPaypal
                            ? `<td data-label="PayPal"><span class="money">${isPaypalOrCard(v.metodo_pago) ? '$' + v.subtotal.toFixed(2) : ''}</span></td>`
                            : `<td data-label="Método"><span class="method-pill ${methodClass}">${methodLabel}</span></td>`
                        }
                        ${showNeto ? `<td data-label="Neto"><span class="money">${v.precio_neto > 0 ? '$' + v.precio_neto.toFixed(2) : '--'}</span></td>` : ''}
                        <td data-label="Comisión"><span class="money green">${v.comision !== null ? '$' + v.comision.toFixed(2) : '--'}</span></td>
                        <td><button class="btn-nota ${v.nota_contabilidad ? 'has-note' : ''}" onclick="openNotaModal(${v.id})" title="${v.nota_contabilidad ? 'Ver nota' : 'Agregar nota'}">&#9998;</button></td>
                    </tr>
                `;
            });

            // Totals row
            const totals = calcTotals();
            const balanceAmount = totals.paypal - totals.comision;
            const balanceLabel = balanceAmount >= 0 ? 'Le Debo' : 'Me Debe';
            const balanceDisplay = Math.abs(balanceAmount);
            const balanceColor = balanceAmount >= 0 ? 'var(--accent)' : '#dc2626';
            html += `
                        </tbody>
                        <tfoot>
                            <tr>
                                <td></td>
                                <td colspan="5" style="font-weight: 900; text-transform: uppercase; letter-spacing: 1px;">Totales</td>
                                <td data-label="Total Subtotal"><span class="money">$${totals.subtotal.toFixed(2)}</span></td>
                                ${showPaypal ? `<td data-label="Total PayPal"><span class="money">$${totals.paypal.toFixed(2)}</span></td>` : '<td></td>'}
                                ${showNeto ? `<td data-label="Total Neto"><span class="money">$${totals.neto.toFixed(2)}</span></td>` : ''}
                                <td data-label="Total Comisión"><span class="money green">$${totals.comision.toFixed(2)}</span></td>
                                <td></td>
                            </tr>
                            ${showPaypal ? `<tr>
                                <td></td>
                                <td colspan="5" style="font-weight: 900; text-transform: uppercase; letter-spacing: 1px; color: ${balanceColor};">${balanceLabel}</td>
                                <td></td>
                                <td></td>
                                <td data-label="${balanceLabel}"><span class="money" style="font-weight: 900; font-size: 16px; color: ${balanceColor};">$${balanceDisplay.toFixed(2)}</span></td>
                                <td></td>
                            </tr>` : ''}
                        </tfoot>
                    </table>
                </div>
            `;

            container.innerHTML = html;
        }

        // ═══ Stats ═══
        function updateStats() {
            const totals = calcTotals();
            const showPaypal = currentChoferInfo?.comision_tipo === 'porcentaje';
            document.getElementById('stat-viajes').textContent = currentViajes.length;
            document.getElementById('stat-subtotal').textContent = `$${totals.subtotal.toFixed(2)}`;
            document.getElementById('stat-comision').textContent = `$${totals.comision.toFixed(2)}`;
            document.getElementById('stat-pendiente').textContent = `$${totals.pendiente.toFixed(2)}`;

            const paypalCard = document.getElementById('stat-paypal-card');
            const ledeboCard = document.getElementById('stat-ledebo-card');
            if (showPaypal) {
                paypalCard.style.display = '';
                ledeboCard.style.display = '';
                document.getElementById('stat-paypal').textContent = `$${totals.paypal.toFixed(2)}`;
                const bal = totals.paypal - totals.comision;
                const ledeboLabel = document.querySelector('#stat-ledebo-card .stat-label');
                const ledeboValue = document.getElementById('stat-ledebo');
                if (bal >= 0) {
                    ledeboLabel.textContent = 'Le Debo';
                    ledeboValue.textContent = `$${bal.toFixed(2)}`;
                    ledeboValue.className = 'stat-value amber';
                } else {
                    ledeboLabel.textContent = 'Me Debe';
                    ledeboValue.textContent = `$${Math.abs(bal).toFixed(2)}`;
                    ledeboValue.className = 'stat-value';
                    ledeboValue.style.color = '#dc2626';
                }
            } else {
                paypalCard.style.display = 'none';
                ledeboCard.style.display = 'none';
            }
        }

        function isPaypalOrCard(method) {
            if (!method) return false;
            const m = method.toLowerCase();
            return m.includes('paypal') || m.includes('card') || m.includes('tarjeta') || m.includes('stripe');
        }

        function calcTotals() {
            let subtotal = 0, neto = 0, comision = 0, pendiente = 0, pagado = 0, paypal = 0;
            currentViajes.forEach(v => {
                subtotal += v.subtotal;
                neto += v.precio_neto;
                if (isPaypalOrCard(v.metodo_pago)) {
                    paypal += v.subtotal;
                }
                if (v.comision !== null) {
                    comision += v.comision;
                    if (v.pagado) {
                        pagado += v.comision;
                    } else {
                        pendiente += v.comision;
                    }
                }
            });
            return { subtotal, neto, comision, pendiente, pagado, paypal };
        }

        // ═══ Toggle pagado ═══
        async function togglePagado(viajeId, pagado) {
            try {
                const response = await fetch(`api/contabilidad_api.php?viaje_id=${viajeId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pagado: pagado ? 1 : 0 })
                });

                if (!response.ok) throw new Error('Error actualizando');

                // Actualizar datos locales
                const viaje = currentViajes.find(v => v.id === viajeId);
                if (viaje) viaje.pagado = pagado ? 1 : 0;

                // Actualizar visual
                const row = document.getElementById(`row-${viajeId}`);
                if (row) {
                    row.classList.toggle('paid', pagado);
                }

                updateStats();
            } catch (err) {
                console.error('Error actualizando pago:', err);
                // Revertir checkbox
                const cb = document.querySelector(`#row-${viajeId} .checkbox-paid`);
                if (cb) cb.checked = !pagado;
            }
        }

        // ═══ Sidebar toggle ═══
        function toggleSidebar() {
            const sidebar = document.getElementById('driver-sidebar');
            const btn = document.getElementById('btn-open-sidebar');
            sidebar.classList.toggle('collapsed');
            btn.classList.toggle('visible', sidebar.classList.contains('collapsed'));
        }

        // ═══ Helpers ═══
        // Cotizaciones nuevas usan IDs >= 10,000,000 (offset para no chocar con WooCommerce).
        // Se muestran como "C-1", "C-2", etc. Reservas normales se muestran como "#123".
        function formatOrderId(id) {
            const n = Number(id);
            if (n >= 10000000) return `C-${n - 9999999}`;
            return `#${n}`;
        }

        function formatDateShort(dateStr) {
            if (!dateStr) return '--';
            const months = ['ENE', 'FEB', 'MAR', 'ABR', 'MAY', 'JUN', 'JUL', 'AGO', 'SEP', 'OCT', 'NOV', 'DIC'];
            const parts = dateStr.split('-');
            const day = parseInt(parts[2]);
            const month = months[parseInt(parts[1]) - 1];
            return `${day}/${month}/${parts[0]}`;
        }

        function formatTime12h(time) {
            if (!time) return '';
            const [h, m] = time.split(':');
            const hour = parseInt(h);
            const ampm = hour >= 12 ? 'PM' : 'AM';
            const h12 = hour % 12 || 12;
            return `${h12}:${m} ${ampm}`;
        }

        function getMethodClass(method) {
            if (!method) return 'method-other';
            const m = method.toLowerCase();
            if (m.includes('cash') || m.includes('efectivo') || m.includes('upon')) return 'method-cash';
            if (m.includes('paypal')) return 'method-paypal';
            if (m.includes('card') || m.includes('tarjeta') || m.includes('stripe')) return 'method-card';
            return 'method-other';
        }

        function getMethodLabel(method) {
            if (!method) return 'N/A';
            const m = method.toLowerCase();
            if (m.includes('cash') || m.includes('efectivo') || m.includes('upon')) return 'Cash';
            if (m.includes('paypal')) return 'PayPal';
            if (m.includes('card') || m.includes('tarjeta') || m.includes('stripe')) return 'Tarjeta';
            return method;
        }
        // ═══ Modal Comisión ═══
        function openComisionModal() {
            if (!currentChoferInfo) return;
            const isPct = currentChoferInfo.comision_tipo === 'porcentaje';
            document.getElementById('comision-radio-pct').checked = isPct;
            document.getElementById('comision-radio-neto').checked = !isPct;
            document.getElementById('comision-pct-input').value = isPct
                ? parseFloat(currentChoferInfo.comision_porcentaje) || ''
                : '';
            onComisionTipoChange();
            document.getElementById('comision-overlay').classList.add('active');
        }

        function closeComisionModal() {
            document.getElementById('comision-overlay').classList.remove('active');
        }

        function onComisionTipoChange() {
            const isPct = document.getElementById('comision-radio-pct').checked;
            document.getElementById('comision-pct-row').style.display = isPct ? '' : 'none';
        }

        async function saveComision() {
            if (!currentChoferInfo) return;

            const tipo = document.getElementById('comision-radio-pct').checked ? 'porcentaje' : 'neto';
            const porcentaje = parseFloat(document.getElementById('comision-pct-input').value) || 0;

            if (tipo === 'porcentaje' && (porcentaje <= 0 || porcentaje > 100)) {
                alert('Ingresa un porcentaje válido entre 1 y 100.');
                return;
            }

            const btn = document.getElementById('comision-btn-save');
            btn.textContent = 'Guardando...';
            btn.disabled = true;

            try {
                const token = sessionStorage.getItem('session_token');
                const resp = await fetch(`api/choferes.php?id=${currentChoferInfo.id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Session-Token': token },
                    body: JSON.stringify({ comision_tipo: tipo, comision_porcentaje: porcentaje })
                });
                if (!resp.ok) {
                    const err = await resp.json().catch(() => ({}));
                    throw new Error(err.error || 'Error al guardar');
                }
                const updated = await resp.json();

                // Actualizar en el array global
                const idx = allDrivers.findIndex(d => d.id == updated.id);
                if (idx !== -1) allDrivers[idx] = { ...allDrivers[idx], ...updated };

                // Actualizar info local y forzar recarga completa (recalcula comisiones)
                currentChoferInfo = { ...currentChoferInfo, ...updated };
                closeComisionModal();
                selectDriver(currentDriver); // re-renderiza título y recarga viajes
            } catch (err) {
                alert('Error: ' + err.message);
            } finally {
                btn.textContent = 'Guardar';
                btn.disabled = false;
            }
        }

        // ═══ Notas de contabilidad ═══
        let notaViajeId = null;

        function openNotaModal(viajeId) {
            notaViajeId = viajeId;
            const viaje = currentViajes.find(v => v.id === viajeId);
            const textarea = document.getElementById('nota-textarea');
            textarea.value = viaje?.nota_contabilidad || '';
            document.getElementById('nota-overlay').classList.add('active');
            setTimeout(() => textarea.focus(), 100);
        }

        function closeNotaModal() {
            document.getElementById('nota-overlay').classList.remove('active');
            notaViajeId = null;
        }

        async function saveNota() {
            if (!notaViajeId) return;
            const textarea = document.getElementById('nota-textarea');
            const nota = textarea.value.trim();
            const btn = document.getElementById('nota-btn-save');
            const originalBtnText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Guardando...`;

            try {
                const response = await fetch(`api/viajes_api.php?viaje_id=${notaViajeId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nota_contabilidad: nota })
                });

                if (!response.ok) throw new Error('Error guardando nota');

                // Actualizar datos locales
                const viaje = currentViajes.find(v => v.id === notaViajeId);
                if (viaje) viaje.nota_contabilidad = nota;

                // Actualizar botón en la tabla
                const btnNota = document.querySelector(`#row-${notaViajeId} .btn-nota`);
                if (btnNota) {
                    btnNota.classList.toggle('has-note', !!nota);
                    btnNota.title = nota ? 'Ver nota' : 'Agregar nota';
                }

                closeNotaModal();
            } catch (err) {
                console.error('Error guardando nota:', err);
                alert('Error al guardar la nota');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalBtnText;
            }
        }

        // Cerrar modal con Escape o click fuera
        document.getElementById('nota-overlay').addEventListener('click', function (e) {
            if (e.target === this) closeNotaModal();
        });
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && document.getElementById('nota-overlay').classList.contains('active')) {
                closeNotaModal();
            }
        });
    </script>

    <!-- Modal Tipo de Comisión -->
    <div class="comision-overlay" id="comision-overlay" onclick="closeComisionModal()">
        <div class="comision-modal" onclick="event.stopPropagation()">
            <div class="comision-modal-header">
                <h3>Tipo de Comisión</h3>
                <button class="comision-modal-close" onclick="closeComisionModal()">&#10005;</button>
            </div>
            <div class="comision-modal-body">
                <div class="comision-opciones">
                    <label class="comision-opcion">
                        <input type="radio" id="comision-radio-pct" name="comision-tipo" value="porcentaje"
                               onchange="onComisionTipoChange()">
                        <div class="comision-opcion-icon">📊</div>
                        <div class="comision-opcion-title">Porcentaje</div>
                        <div class="comision-opcion-desc">Recibe % del subtotal de cada viaje</div>
                    </label>
                    <label class="comision-opcion">
                        <input type="radio" id="comision-radio-neto" name="comision-tipo" value="neto"
                               onchange="onComisionTipoChange()">
                        <div class="comision-opcion-icon">💵</div>
                        <div class="comision-opcion-title">Precio Neto</div>
                        <div class="comision-opcion-desc">Precio fijo definido por viaje</div>
                    </label>
                </div>
                <div class="comision-pct-row" id="comision-pct-row">
                    <label>Porcentaje (%)</label>
                    <input type="number" id="comision-pct-input" min="1" max="100" step="0.5"
                           placeholder="Ej: 20">
                </div>
            </div>
            <div class="comision-modal-footer">
                <button class="nota-btn nota-btn-cancel" onclick="closeComisionModal()">Cancelar</button>
                <button id="comision-btn-save" onclick="saveComision()"
                    class="px-6 py-2 bg-[#002a3f] text-white rounded-lg font-bold text-xs uppercase tracking-widest hover:bg-[#003d5c] transition shadow-md">
                    Guardar
                </button>
            </div>
        </div>
    </div>

    <!-- Modal de Notas -->
    <div class="nota-overlay" id="nota-overlay">
        <div class="nota-modal">
            <div class="nota-modal-header">
                <h3>NOTA DE CONTABILIDAD</h3>
                <button class="nota-modal-close" onclick="closeNotaModal()">&#10005;</button>
            </div>
            <div class="nota-modal-body">
                <textarea id="nota-textarea" placeholder="Escribir nota..."></textarea>
            </div>
            <div class="nota-modal-footer">
                <button class="nota-btn nota-btn-cancel" onclick="closeNotaModal()">Cancelar</button>
                <button id="nota-btn-save" onclick="saveNota()"
                    class="px-6 py-2 bg-green-600 text-white rounded-lg font-bold text-xs uppercase tracking-widest hover:bg-green-700 transition shadow-md">
                    Guardar
                </button>
            </div>
        </div>
    </div>
</body>

</html>
