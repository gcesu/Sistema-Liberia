    <script>
        (async function checkAuth() {
            const token = sessionStorage.getItem('session_token');
            if (!token) { window.location.href = '/login'; return; }
            try {
                const response = await fetch('api/check_session.php', { headers: { 'X-Session-Token': token } });
                const data = await response.json();
                if (!data.authenticated) { sessionStorage.removeItem('session_token'); window.location.href = '/login'; }
            } catch (error) { window.location.href = '/login'; }
        })();
    </script>

    <script src="menu.js" defer></script>

    <script>
        const API_URL = 'api/cotizaciones.php';

        // Keys del formulario Hotel-Hotel / One Way Shuttle
        const KEY_PICKUP_LOC = 'wccpf_uqmQV1WN1jeT';
        const KEY_DROPOFF_LOC = 'wccpf_1leEY9NyPBq8';
        const KEY_PICKUP_DATE = 'wccpf_GKaNQcnBtnRd';
        const KEY_PICKUP_TIME = 'wccpf_rltyePZt3ZCD';
        const KEY_PAX = 'wccpf_MikTE0O9596X';

        let allOrders = [];
        let currentPage = 1;
        const itemsPerPage = 20;
        let currentOrderId = null;
        let originalStatusViaje = '';

        const COUNTRY_MAP = { 'CR': 'Costa Rica', 'US': 'Estados Unidos', 'CA': 'Canadá', 'GB': 'Reino Unido', 'DE': 'Alemania', 'FR': 'Francia', 'ES': 'España', 'MX': 'México', 'BR': 'Brasil', 'AR': 'Argentina', 'CO': 'Colombia', 'CL': 'Chile', 'PE': 'Perú', 'GT': 'Guatemala', 'HN': 'Honduras', 'SV': 'El Salvador', 'NI': 'Nicaragua', 'PA': 'Panamá', 'IT': 'Italia', 'PT': 'Portugal', 'NL': 'Países Bajos', 'AU': 'Australia', 'NZ': 'Nueva Zelanda', 'JP': 'Japón', 'CN': 'China', 'IN': 'India', 'ZA': 'Sudáfrica', 'AE': 'Emiratos Árabes', 'TR': 'Turquía' };

        // ── Helpers ──────────────────────────────────────────────────────────

        function getInitials(name) {
            if (!name) return '##';
            const p = name.trim().split(' ').filter(Boolean);
            return p.length === 1 ? p[0][0].toUpperCase() : (p[0][0] + p[p.length - 1][0]).toUpperCase();
        }

        function capitalizeName(name) {
            if (!name) return '';
            return name.toLowerCase().split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
        }

        function formatDateShort(d) {
            if (!d) return '---';
            const months = ['ENE', 'FEB', 'MAR', 'ABR', 'MAY', 'JUN', 'JUL', 'AGO', 'SEP', 'OCT', 'NOV', 'DIC'];
            const s = String(d).split('T')[0];
            const p = s.split('-');
            if (p.length === 3) return `${parseInt(p[2])}/${months[parseInt(p[1]) - 1]}/${p[0]}`;
            return d;
        }

        function formatTime(t) {
            if (!t) return '--:--';
            const m = String(t).match(/^(\d{1,2}):(\d{2})/);
            if (!m) return String(t);
            let h = parseInt(m[1]);
            const min = m[2], ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            return `${h}:${min} ${ampm}`;
        }

        function translateStatus(s) {
            return { pending: 'Pendiente', processing: 'En Proceso', 'on-hold': 'En Espera', completed: 'Completada', cancelled: 'Cancelada', failed: 'Fallida' }[s] || s;
        }

        function statusClass(s) {
            return { completed: 'status-completed', processing: 'status-processing', pending: 'status-pending', cancelled: 'status-cancelled', 'on-hold': 'status-on-hold', failed: 'status-failed' }[s] || 'status-pending';
        }

        function getMeta(arr, key) {
            if (!Array.isArray(arr)) return null;
            const m = arr.find(x => x.key === key);
            return m ? (m.value ?? null) : null;
        }

        function esLineItemInterno(item) {
            if ((item.meta_data || []).some(m => m.key === KEY_PICKUP_LOC)) return true;
            const n = (item.name || '').toLowerCase();
            return ['one way shuttle', 'hotel-hotel', 'hotel to hotel', 'hotel – hotel', 'hotel - hotel'].some(x => n.includes(x));
        }

        // ── Carga ─────────────────────────────────────────────────────────────

        async function loadOrders() {
            try {
                const res = await fetch(API_URL);
                if (!res.ok) throw new Error();
                allOrders = await res.json();
                renderTable();
            } catch {
                document.getElementById('table-body').innerHTML =
                    `<tr><td colspan="6" class="text-center py-10 text-red-400 font-bold text-xs uppercase">Error cargando datos</td></tr>`;
            }
        }

        window.refreshData = () => loadOrders();

        // ── Tabla ─────────────────────────────────────────────────────────────

        function renderTable() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            const start = (currentPage - 1) * itemsPerPage;
            const pageData = allOrders.slice(start, start + itemsPerPage);
            document.getElementById('total-count').textContent = allOrders.length;
            updatePagination();

            if (!pageData.length) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-12 text-gray-400 font-bold text-xs uppercase tracking-wider">No se encontraron cotizaciones</td></tr>`;
                return;
            }

            pageData.forEach(o => {
                const viajes = o.viajes || [];
                const sv = o.status_viaje || o.status;
                const rawName = [o.billing?.last_name, o.billing?.first_name].filter(Boolean).join(' ') || `Cotización #${o.id}`;
                const name = capitalizeName(rawName);

                const tripBadges = viajes.map(v => {
                    const cls = v.tipo === 'llegada' ? 'badge-llegada' : v.tipo === 'salida' ? 'badge-salida' : 'badge-interno';
                    const label = v.tipo === 'llegada' ? 'Llegada' : v.tipo === 'salida' ? 'Salida' : 'Interno';
                    return `<span class="trip-badge ${cls}">${label}</span>`;
                }).join(' ');

                const tr = document.createElement('tr');
                tr.onclick = () => viewOrder(o.id);
                tr.innerHTML = `
                    <td data-label="ID" class="pl-6">
                        <div class="font-bold text-[#002a3f]">#${o.id}</div>
                        <div class="text-xs text-gray-400 font-bold">${formatDateShort(o.date_created)}</div>
                    </td>
                    <td data-label="Cliente">
                        <div class="flex items-center">
                            <div class="client-avatar">${getInitials(name)}</div>
                            <div>
                                <div class="font-bold text-[#002a3f]">${name}</div>
                                <div class="text-xs text-gray-400">${o.billing?.email || ''}</div>
                            </div>
                        </div>
                    </td>
                    <td data-label="Viajes"><div class="flex flex-wrap gap-1">${tripBadges || '<span class="text-gray-400 text-xs">Sin viajes</span>'}</div></td>
                    <td data-label="Total" class="font-bold font-mono text-[#002a3f]">$${parseFloat(o.total || 0).toFixed(2)}</td>
                    <td data-label="Status"><span class="status-pill ${statusClass(sv)}"><span class="status-dot"></span>${translateStatus(sv)}</span></td>
                    <td data-label="Acción" class="pr-6 text-right">
                        <button onclick="event.stopPropagation();viewOrder(${o.id})"
                            class="bg-[#002a3f] text-white px-4 py-2 rounded-lg font-bold uppercase text-xs hover:bg-[#ed4441] transition-all">VER</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // ── Paginación ────────────────────────────────────────────────────────

        function updatePagination() {
            const total = allOrders.length;
            const totalPages = Math.ceil(total / itemsPerPage) || 1;
            const start = (currentPage - 1) * itemsPerPage + 1, end = Math.min(currentPage * itemsPerPage, total);
            document.getElementById('pagination-info').textContent = `Mostrando ${total === 0 ? 0 : start}–${end} de ${total}`;
            const ctrl = document.getElementById('pagination-controls');
            ctrl.innerHTML = '';
            if (totalPages <= 1) return;
            const mk = (lbl, fn, act = false) => { const b = document.createElement('button'); b.className = `pagination-btn${act ? ' active' : ''}`; b.textContent = lbl; b.onclick = fn; ctrl.appendChild(b); };
            if (currentPage > 1) mk('◀', () => goToPage(currentPage - 1));
            for (let i = Math.max(1, currentPage - 2); i <= Math.min(totalPages, currentPage + 2); i++) mk(i, () => goToPage(i), i === currentPage);
            if (currentPage < totalPages) mk('▶', () => goToPage(currentPage + 1));
        }

        function goToPage(p) { currentPage = p; renderTable(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

        // ── Modal ─────────────────────────────────────────────────────────────

        function viewOrder(id) {
            const o = allOrders.find(x => x.id === id);
            if (!o) return;
            currentOrderId = id;

            // Parsear raw_data para acceder a los meta_data de los line_items
            let rawOrder = null;
            try { rawOrder = typeof o.raw_data === 'string' ? JSON.parse(o.raw_data) : o.raw_data; } catch { }

            document.body.style.overflow = 'hidden';
            document.getElementById('order-modal').classList.add('open');
            document.getElementById('btn-save').classList.add('hidden');

            // Título y status
            document.getElementById('modal-title').textContent = `Cotización #${o.id}`;
            const sv = o.status_viaje || o.status;
            const pill = document.getElementById('modal-status-pill');
            pill.className = `status-pill ${statusClass(sv)}`;
            pill.innerHTML = `<span class="status-dot"></span> ${translateStatus(sv)}`;

            // Cliente
            const rawName = [o.billing?.last_name, o.billing?.first_name].filter(Boolean).join(' ') || `Cotización #${o.id}`;
            const name = capitalizeName(rawName);
            const email = (o.billing?.email || '').toLowerCase();
            const phone = o.billing?.phone || '';
            const country = (o.billing?.country || '').toUpperCase();
            const address = o.billing?.address_1 || o.cliente_direccion || '';

            document.getElementById('modal-client-name').textContent = name;
            document.getElementById('modal-email').textContent = email || '---';
            document.getElementById('modal-phone').textContent = phone || '---';
            document.getElementById('modal-country').textContent = COUNTRY_MAP[country] || country || '---';
            document.getElementById('modal-address').textContent = address || '---';
            document.getElementById('modal-email-btn').href = `mailto:${email}`;
            document.getElementById('modal-whatsapp-btn').href = PhoneUtils.buildWhatsappUrl(phone, country);

            const note = o.customer_note || '';
            const noteC = document.getElementById('modal-note-container');
            if (note.trim()) { document.getElementById('modal-note').textContent = note; noteC.classList.remove('hidden'); }
            else noteC.classList.add('hidden');

            // Status select
            document.getElementById('input-status-viaje').value = sv;
            originalStatusViaje = sv;

            // ── Enriquecer viajes con datos del raw_data ──
            const viajesDB = o.viajes || [];
            const lineItemsRaw = rawOrder?.line_items || [];

            const viajes = viajesDB.map(v => {
                if (v.tipo !== 'interno') {
                    return { ...v, destino_display: v.destino || v.hotel || '' };
                }
                // Viaje interno: extraer datos del line_item correspondiente
                const li = lineItemsRaw[v.item_index] || lineItemsRaw.find(l => esLineItemInterno(l));
                if (li) {
                    const meta = li.meta_data || [];
                    return {
                        ...v,
                        pickup: getMeta(meta, KEY_PICKUP_LOC) || v.destino?.split('→')[0]?.trim() || '',
                        dropoff: getMeta(meta, KEY_DROPOFF_LOC) || v.destino?.split('→')[1]?.trim() || '',
                        fecha: getMeta(meta, KEY_PICKUP_DATE) || v.fecha,
                        hora: getMeta(meta, KEY_PICKUP_TIME) || v.hora,
                        pax: parseInt(getMeta(meta, KEY_PAX) || v.pax || '1'),
                    };
                }
                return { ...v, pickup: v.destino?.split('→')[0]?.trim() || '', dropoff: v.destino?.split('→')[1]?.trim() || '' };
            });

            // Ordenar: llegada → interno → salida
            const typeOrder = { llegada: 0, interno: 1, salida: 2 };
            const sorted = [...viajes].sort((a, b) => (typeOrder[a.tipo] ?? 9) - (typeOrder[b.tipo] ?? 9));

            // ── Banners de ruta (uno por viaje, idéntico a reservas) ──
            const routeStack = document.getElementById('route-stack');
            routeStack.innerHTML = '';
            sorted.forEach(v => {
                let oi = '✈️', on = 'Aeropuerto LIR', di = '🏨', dn = 'Hotel';
                if (v.tipo === 'llegada') {
                    oi = '🛬'; on = 'Aeropuerto LIR'; di = '🏨'; dn = v.destino_display || v.destino || 'Hotel';
                } else if (v.tipo === 'salida') {
                    oi = '🏨'; on = v.destino_display || v.destino || 'Hotel'; di = '🛫'; dn = 'Aeropuerto LIR';
                } else {
                    oi = '🏨'; on = v.pickup || 'Hotel Origen'; di = '🏨'; dn = v.dropoff || 'Hotel Destino';
                }
                const card = document.createElement('div');
                card.className = 'route-visualizer';
                card.innerHTML = `
                    <div class="route-point">
                        <span style="font-size:2rem">${oi}</span>
                        <span class="route-point-label">Origen</span>
                        <span class="route-point-name">${on}</span>
                    </div>
                    <div style="font-size:1.75rem">➡️</div>
                    <div class="route-point">
                        <span style="font-size:2rem">${di}</span>
                        <span class="route-point-label">Destino</span>
                        <span class="route-point-name">${dn}</span>
                    </div>
                `;
                routeStack.appendChild(card);
            });

            // ── Pills Tipo + Pax ──
            const nLlegada = sorted.filter(v => v.tipo === 'llegada').length;
            const nSalida = sorted.filter(v => v.tipo === 'salida').length;
            const nInterno = sorted.filter(v => v.tipo === 'interno').length;
            const total = sorted.length;
            let tipoLabel = total === 1
                ? (nLlegada ? 'Solo Llegada' : nSalida ? 'Solo Salida' : 'Viaje Interno')
                : (nLlegada && nSalida && !nInterno ? 'Ida y Vuelta' : `${total} Viajes`);
            document.getElementById('pill-tipo').textContent = tipoLabel;
            document.getElementById('pill-pax').textContent = sorted.reduce((mx, v) => Math.max(mx, v.pax || 1), 1);

            // ── Tarjetas de viaje ──
            renderViajeCards(sorted);

            // ── Financiero ──
            renderFinancial(o, rawOrder);

            document.querySelectorAll('#modal-box .modal-main-content, #modal-box .modal-sidebar')
                .forEach(el => el.scrollTop = 0);
        }

        // ── Tarjetas viaje (idénticas a reservas) ────────────────────────────

        function renderViajeCards(viajes) {
            const container = document.getElementById('viajes-container');
            container.innerHTML = '';

            if (!viajes.length) {
                container.innerHTML = `<div class="col-span-2 text-center py-8 text-gray-400 text-sm font-bold uppercase tracking-wider">Sin viajes registrados</div>`;
                return;
            }

            viajes.forEach(v => {
                const isL = v.tipo === 'llegada', isS = v.tipo === 'salida', isI = v.tipo === 'interno';
                const dotClass = isL ? 'title-dot-llegada' : isS ? 'title-dot-salida' : 'title-dot-interno';
                const bgBorder = isL ? 'border-blue-100' : isS ? 'border-orange-100' : 'border-yellow-100';
                const bgFill = isL ? 'bg-blue-50/50' : isS ? 'bg-orange-50/50' : 'bg-yellow-50/50';
                const lblColor = isL ? 'text-blue-400 border-blue-200' : isS ? 'text-orange-400 border-orange-200' : 'text-amber-500 border-amber-200';
                const cardLabel = isL ? 'LLEGADA' : isS ? 'SALIDA' : 'VIAJE INTERNO';
                const sub = isI
                    ? (v.pickup && v.dropoff ? `· ${v.pickup} → ${v.dropoff}` : '')
                    : (v.destino_display || v.destino ? `· ${(v.destino_display || v.destino).toUpperCase()}` : '');

                let logHTML = '';
                if (isI) {
                    logHTML = `
                        <div><p class="meta-field-label">Origen</p><p class="meta-field-value text-base">${v.pickup || '<span class="text-gray-300 font-normal text-sm">Sin datos</span>'}</p></div>
                        <div><p class="meta-field-label">Destino</p><p class="meta-field-value text-base">${v.dropoff || '<span class="text-gray-300 font-normal text-sm">Sin datos</span>'}</p></div>
                        <div><p class="meta-field-label">Fecha</p><p class="meta-field-value text-base">${formatDateShort(v.fecha)}</p></div>
                        <div><p class="meta-field-label">Hora</p><p class="meta-field-value text-base">${formatTime(v.hora)}</p></div>
                    `;
                } else {
                    const fl = isL ? 'Fecha' : 'Fecha de Recogida', hl = isL ? 'Hora' : 'Hora de Recogida';
                    logHTML = `
                        <div><p class="meta-field-label">${fl}</p><p class="meta-field-value text-base">${formatDateShort(v.fecha)}</p></div>
                        <div><p class="meta-field-label">${hl}</p><p class="meta-field-value text-base">${formatTime(v.hora)}</p></div>
                        <div><p class="meta-field-label">Vuelo</p><p class="meta-field-value text-base">${(v.vuelo || '--').toUpperCase()}</p></div>
                        <div><p class="meta-field-label">Hotel</p><p class="meta-field-value text-base">${v.destino_display || v.destino || v.hotel || '---'}</p></div>
                    `;
                }

                const card = document.createElement('div');
                card.className = 'operation-card';
                card.innerHTML = `
                    <div class="operation-card-header">
                        <div class="operation-card-title">
                            <span class="${dotClass}"></span>${cardLabel}
                            ${sub ? `<span class="text-gray-400 font-normal text-xs">${sub}</span>` : ''}
                        </div>
                    </div>
                    <div class="operation-card-body space-y-5">
                        <div class="grid grid-cols-2 gap-4">${logHTML}</div>
                        <div class="${bgFill} ${bgBorder} -mx-5 -mb-5 p-5 border-t">
                            <div class="operation-section-label ${lblColor}">Asignación Operativa</div>
                            <div class="field-group-row">
                                <div>
                                    <p class="meta-field-label">🚐 Chofer</p>
                                    <p class="meta-field-value text-sm">${v.chofer || '<span class="text-gray-300 font-normal">No asignado</span>'}</p>
                                </div>
                                <div>
                                    <p class="meta-field-label">👥 Subchofer</p>
                                    <p class="meta-field-value text-sm">${v.subchofer || '<span class="text-gray-300 font-normal">---</span>'}</p>
                                </div>
                            </div>
                            ${v.nota_choferes ? `<div class="mt-3"><p class="meta-field-label">📢 Nota Choferes</p><p class="meta-field-value text-sm">${v.nota_choferes}</p></div>` : ''}
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // ── Financiero ────────────────────────────────────────────────────────

        function renderFinancial(o, rawOrder) {
            const container = document.getElementById('financial-breakdown');
            container.innerHTML = '';
            const addRow = (label, value, bold = false, discount = false) => {
                const num = parseFloat(value);
                if (isNaN(num) || num === 0) return;
                const fmt = discount ? `-$${Math.abs(num).toFixed(2)}` : `$${num.toFixed(2)}`;
                const col = discount ? 'text-green-600' : 'text-[#002a3f]';
                container.innerHTML += `<div class="fin-row ${bold ? 'pt-3 border-t border-dashed border-gray-200 mt-2' : 'text-sm'}"><span class="font-bold uppercase opacity-50 text-[10px] tracking-widest">${label}</span><span class="font-bold ${bold ? 'text-2xl' : 'text-base'} ${col}">${fmt}</span></div>`;
            };
            if (o.payment_method_title) container.innerHTML += `<div class="text-[10px] uppercase font-black text-gray-400 mb-4 border-b pb-2">Método: ${o.payment_method_title}</div>`;
            const lis = rawOrder?.line_items || [];
            const sub = lis.length ? lis.reduce((s, li) => s + parseFloat(li.subtotal || 0), 0) : parseFloat(o.subtotal || 0);
            addRow('Subtotal Servicios', sub, true);
            (rawOrder?.fee_lines || []).forEach(f => addRow(f.name || 'Cargo', f.total));
            (rawOrder?.tax_lines || []).forEach(t => addRow(t.label || 'Impuesto', t.tax_total));
            (rawOrder?.coupon_lines || []).forEach(c => addRow(`Cupón: ${c.code}`, c.discount, false, true));
            addRow('Total', o.total);
        }

        // ── Guardar estado ────────────────────────────────────────────────────

        function checkForChanges() {
            document.getElementById('btn-save').classList.toggle('hidden',
                document.getElementById('input-status-viaje').value === originalStatusViaje);
        }

        async function saveChanges() {
            if (!currentOrderId) return;
            const btn = document.getElementById('btn-save');
            btn.disabled = true; btn.textContent = 'Guardando...';
            const newStatus = document.getElementById('input-status-viaje').value;
            try {
                const res = await fetch(`${API_URL}?order_id=${currentOrderId}`, {
                    method: 'PUT', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status_viaje: newStatus })
                });
                if (!res.ok) throw new Error();
                const idx = allOrders.findIndex(o => o.id === currentOrderId);
                if (idx !== -1) allOrders[idx].status_viaje = newStatus;
                originalStatusViaje = newStatus;
                btn.classList.add('hidden');
                const pill = document.getElementById('modal-status-pill');
                pill.className = `status-pill ${statusClass(newStatus)}`;
                pill.innerHTML = `<span class="status-dot"></span> ${translateStatus(newStatus)}`;
                renderTable();
            } catch { alert('Error al guardar'); }
            finally { btn.disabled = false; btn.textContent = 'Guardar Cambios'; }
        }

        // ── Cerrar ────────────────────────────────────────────────────────────

        function closeModal() {
            document.getElementById('order-modal').classList.remove('open');
            document.body.style.overflow = '';
        }

        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

        loadOrders();
    </script>
</body>

</html>
