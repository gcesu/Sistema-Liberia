<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotizaciones Especiales - Sistema Liberia</title>

    <!-- Fonts: Lato & Oswald -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&family=Oswald:wght@400;700&display=swap"
        rel="stylesheet">

    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.css">

    <style>
        :root {
            --primary: #002a3f;
            --secondary: #ffffff;
            --accent: #ed4441;
            --bg-light: #f1f5f9;
            --whatsapp: #25d366;
            --email-btn: #3b82f6;
        }

        body {
            font-family: 'Lato', sans-serif;
            background-color: var(--bg-light);
            color: #333;
            margin: 0;
            -webkit-font-smoothing: antialiased;
            font-size: 15px;
        }

        h1,
        h2,
        h3,
        .title-font {
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        /* --- ESTILO DE TABLA LINEAL --- */
        .main-container {
            width: 100%;
            padding: 18px 18px 32px;
            max-width: none;
            margin: 0;
        }

        @media (max-width: 768px) {
            .main-container {
                padding: 12px;
            }
        }

        @media (min-width: 768px) {
            .main-container {
                padding: 30px;
            }
        }

        .table-wrapper {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 0;
            width: 100%;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            background-color: #f8fafc;
            padding: 16px 20px;
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            color: #64748b;
            border-bottom: 2px solid #e2e8f0;
            text-align: left;
            letter-spacing: 1px;
        }

        tbody tr {
            background: white;
            border-bottom: 1px solid #e2e8f0;
            transition: all 0.2s ease;
        }

        tbody tr:hover {
            background: #f8fafc;
        }

        td {
            padding: 16px 20px;
            font-size: 15px;
            color: #334155;
            vertical-align: middle;
        }

        /* Status Pills */
        .status-pill {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.5px;
        }

        .status-completed {
            background: #dcfce7;
            color: #166534;
        }

        .status-processing {
            background: #fef9c3;
            color: #854d0e;
        }

        .status-on-hold {
            background: #ffedd5;
            color: #9a3412;
        }

        .status-pending {
            background: #fef3c7;
            color: #92400e;
        }

        .status-cancelled,
        .status-failed {
            background: #fee2e2;
            color: #991b1b;
        }

        /* Modal */
        #modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
        }

        #modal-box {
            background: white;
            width: 95vw;
            height: 90vh;
            max-width: 1400px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
    </style>
</head>

<body>

    <!-- Navbar Component -->
    <admin-navbar></admin-navbar>

    <main class="main-container">
        <!-- Header -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
            <div>
                <h1 class="text-3xl font-bold text-slate-900 tracking-tight">Cotizaciones</h1>
            </div>
        </div>

        <!-- Tabla -->
        <div class="glass-panel overflow-hidden shadow-sm">
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <thead>
                        <tr>
                            <th>ID / Fecha</th>
                            <th>Cliente</th>
                            <th>Ruta (Origen -> Destino)</th>
                            <th class="text-center">Viaje</th>
                            <th class="text-right">Total</th>
                            <th class="text-center">Status</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="orders-table-body">
                        <!-- Rows -->
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="px-6 py-4 border-t border-slate-100 bg-slate-50/50 flex items-center justify-between">
                <span class="text-xs font-bold text-slate-400" id="pagination-info">Mostrando 0-0 de 0</span>
                <div class="flex gap-2">
                    <button onclick="prevPage()"
                        class="p-2 hover:bg-white rounded-lg text-slate-400 hover:text-slate-600 disabled:opacity-50 transition-colors">◀</button>
                    <button onclick="nextPage()"
                        class="p-2 hover:bg-white rounded-lg text-slate-400 hover:text-slate-600 disabled:opacity-50 transition-colors">▶</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal de Detalles -->
    <div id="modal-overlay">
        <div id="modal-box">
            <!-- Modal Header -->
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <div>
                    <h2 class="text-xl font-bold text-slate-800 flex items-center gap-3">
                        <span id="modal-order-id">#0000</span>
                        <span id="modal-order-status" class="status-pill status-processing">Status</span>
                    </h2>
                </div>
                <button onclick="closeModal()"
                    class="p-2 hover:bg-slate-200 rounded-full text-slate-400 transition-colors">✕</button>
            </div>

            <!-- Modal Body -->
            <div class="flex-1 overflow-y-auto p-6 bg-slate-50/50">
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <!-- Columna Izquierda: Detalles del Viaje -->
                    <div class="lg:col-span-2 space-y-6">
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                            <h3 class="text-sm font-black text-slate-400 uppercase tracking-widest mb-4 border-b pb-2">
                                Información del Viaje</h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-y-4 gap-x-8" id="modal-trip-details">
                                <!-- JS Injection -->
                            </div>
                        </div>

                        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                            <h3 class="text-sm font-black text-slate-400 uppercase tracking-widest mb-4 border-b pb-2">
                                Cliente</h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-y-4 gap-x-8" id="modal-customer-details">
                                <!-- JS Injection -->
                            </div>
                        </div>
                    </div>

                    <!-- Columna Derecha: Financiero (Editable) -->
                    <div class="space-y-6">
                        <div
                            class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 border-l-4 border-l-blue-500">
                            <h3 class="text-sm font-black text-slate-400 uppercase tracking-widest mb-4">Resumen
                                Financiero</h3>
                            <div id="payment-breakdown-list">
                                <!-- JS Injection -->
                            </div>
                        </div>

                        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                            <h3 class="text-sm font-black text-slate-400 uppercase tracking-widest mb-4">Acciones
                            </h3>
                            <div class="space-y-3">
                                <label class="block text-xs font-bold text-slate-400 uppercase">Cambiar
                                    Status</label>
                                <select id="input-status"
                                    class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm font-bold text-slate-700 focus:border-blue-500 outline-none">
                                    <option value="pending">Pending Payment</option>
                                    <option value="processing">Processing</option>
                                    <option value="completed">Completed</option>
                                    <option value="cancelled">Cancelled</option>
                                </select>

                                <button id="btn-save" onclick="saveOrderDetails()"
                                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-lg shadow-blue-500/30 transition-all mt-4 hidden">
                                    💾 Guardar Cambios
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="menu.js" defer></script>
    <script>
        const API_URL = 'api/cotizaciones.php';

        // Estado
        let allOrders = [];
        let currentFilteredOrders = [];
        let currentPage = 1;
        const itemsPerPage = 20;
        let currentOrderId = null;

        // Formateadores
        const formatDate = (dateStr) => {
            if (!dateStr) return '-';
            const date = new Date(dateStr);
            return new Intl.DateTimeFormat('es-CR', {
                day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'
            }).format(date);
        };

        const renderStatusBadge = (status) => {
            const map = {
                'completed': 'status-completed',
                'processing': 'status-processing',
                'pending': 'status-pending',
                'cancelled': 'status-cancelled',
                'on-hold': 'status-on-hold'
            };
            const colorClass = map[status] || 'bg-slate-100 text-slate-500';
            return `<span class="status-pill ${colorClass}">${status}</span>`;
        };

        // Cargar Datos
        async function loadOrders() {
            try {
                const res = await fetch(API_URL);
                if (!res.ok) throw new Error('Error fetching data');
                allOrders = await res.json();
                currentFilteredOrders = [...allOrders]; // TODO: Implementar filtros si necesario
                renderTable();
            } catch (err) {
                console.error(err);
                document.getElementById('orders-table-body').innerHTML = `<tr><td colspan="7" class="text-center py-8 text-red-500">Error cargando datos. Revisa la consola.</td></tr>`;
            }
        }

        // Render Tabla
        function renderTable() {
            const tbody = document.getElementById('orders-table-body');
            tbody.innerHTML = '';

            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageData = currentFilteredOrders.slice(start, end);

            // Update Pagination Info
            document.getElementById('pagination-info').innerText =
                `Mostrando ${currentFilteredOrders.length === 0 ? 0 : start + 1}-${Math.min(end, currentFilteredOrders.length)} de ${currentFilteredOrders.length}`;

            if (pageData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center py-12 text-slate-400 italic">No se encontraron cotizaciones</td></tr>`;
                return;
            }

            pageData.forEach(o => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>
                        <div class="font-bold text-slate-900">#${o.id}</div>
                        <div class="text-xs text-slate-400">${formatDate(o.date_created)}</div>
                    </td>
                    <td>
                        <div class="font-bold text-slate-800">${o.billing.first_name || ''} ${o.billing.last_name || ''}</div>
                        <div class="text-xs text-slate-500">${o.billing.email}</div>
                    </td>
                    <td>
                         <div class="flex flex-col">
                            <span class="font-bold text-slate-700">${o.origen || 'No definido'}</span>
                            <span class="text-[10px] text-slate-400 uppercase font-black">Destino:</span>
                            <span class="font-bold text-slate-700">${o.hotel_nombre || 'No definido'}</span>
                        </div>
                    </td>
                    <td class="text-center">
                        <div class="flex flex-col items-center">
                            <span class="font-mono text-slate-600 font-bold">${o.fecha_viaje || '-'}</span>
                            <span class="text-xs text-slate-400">${o.hora_viaje || '-'}</span>
                             <span class="text-[10px] bg-slate-100 px-2 rounded-full mt-1 text-slate-500">PAX: ${o.pasajeros}</span>
                        </div>
                    </td>
                    <td class="text-right font-mono font-bold text-slate-700">$${parseFloat(o.total).toFixed(2)}</td>
                    <td class="text-center">${renderStatusBadge(o.status)}</td>
                    <td class="text-center">
                        <button onclick="viewOrder(${o.id})" class="text-blue-600 hover:text-blue-800 font-bold text-xs bg-blue-50 hover:bg-blue-100 px-3 py-1.5 rounded-lg transition-colors">
                            VER DETALLES
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Pagination Controls
        window.prevPage = () => { if (currentPage > 1) { currentPage--; renderTable(); } };
        window.nextPage = () => { if (currentPage * itemsPerPage < currentFilteredOrders.length) { currentPage++; renderTable(); } };

        // Modal Logic
        window.viewOrder = (id) => {
            currentOrderId = id;
            const o = allOrders.find(x => x.id === id);
            if (!o) return;

            document.getElementById('modal-overlay').style.display = 'flex';
            document.getElementById('modal-order-id').innerText = `#${o.id}`;
            document.getElementById('modal-order-status').className = `status-pill ${renderStatusBadge(o.status).match(/class="status-pill ([^"]+)"/)[1]}`;
            document.getElementById('modal-order-status').innerText = o.status;
            document.getElementById('input-status').value = o.status;

            // Render Trip Details
            document.getElementById('modal-trip-details').innerHTML = `
                <div>
                    <span class="meta-field-label">Origen</span>
                    <div class="meta-field-value">${o.origen || '-'}</div>
                </div>
                <div>
                    <span class="meta-field-label">Destino</span>
                    <div class="meta-field-value">${o.hotel_nombre || '-'}</div>
                </div>
                <div>
                    <span class="meta-field-label">Fecha</span>
                    <div class="meta-field-value">${o.fecha_viaje || '-'}</div>
                </div>
                <div>
                    <span class="meta-field-label">Hora</span>
                    <div class="meta-field-value">${o.hora_viaje || '-'}</div>
                </div>
                <div class="md:col-span-2">
                    <span class="meta-field-label">Notas / Raw Data</span>
                    <div class="text-xs text-slate-400 bg-slate-50 p-2 rounded overflow-x-auto font-mono">
                        ${JSON.stringify(o.meta_data, null, 2)}
                    </div>
                </div>
            `;

            // Render Customer Details
            document.getElementById('modal-customer-details').innerHTML = `
                <div>
                    <span class="meta-field-label">Nombre</span>
                    <div class="meta-field-value">${o.billing.first_name} ${o.billing.last_name}</div>
                </div>
                <div>
                    <span class="meta-field-label">Email</span>
                    <div class="meta-field-value text-blue-600">${o.billing.email}</div>
                </div>
                <div>
                    <span class="meta-field-label">Teléfono</span>
                    <div class="meta-field-value">${o.billing.phone}</div>
                </div>
                 <div>
                    <span class="meta-field-label">Dirección</span>
                    <div class="meta-field-value text-xs">${o.billing.address_1}</div>
                </div>
            `;

            renderPaymentInfo(o);
        };

        window.closeModal = () => {
            document.getElementById('modal-overlay').style.display = 'none';
            document.getElementById('btn-save').classList.add('hidden');
        };

        // Financial Logic (Editable)
        function renderPaymentInfo(o) {
            const container = document.getElementById('payment-breakdown-list');
            const paymentMethods = ['Cash', 'Credit Card', 'Paypal', 'Bank Transfer'];

            let paymentSelect = `<select id="edit-payment-method" class="w-full bg-slate-50 border border-slate-200 rounded px-2 py-1 text-sm mb-4" onchange="recalculateTotal()">`;
            paymentMethods.forEach(pm => {
                const selected = (o.payment_method_title === pm) ? 'selected' : '';
                paymentSelect += `<option value="${pm}" ${selected}>${pm}</option>`;
            });
            paymentSelect += `</select>`;

            // Subtotal Input
            const subtotalVal = parseFloat(o.subtotal) || 0;

            container.innerHTML = `
                <div class="mb-2">
                    <label class="block text-[10px] uppercase font-bold text-slate-400">Método de Pago</label>
                    ${paymentSelect}
                </div>
                
                <div class="space-y-3">
                    <div class="flex justify-between items-center text-sm">
                        <span class="font-bold text-slate-500">Subtotal</span>
                        <input type="number" id="edit-subtotal" value="${subtotalVal.toFixed(2)}" class="w-24 text-right border rounded bg-slate-50 font-bold text-slate-700 px-2 py-1" oninput="recalculateTotal()">
                    </div>
                    
                    <div class="flex justify-between items-center text-sm">
                        <span class="font-bold text-slate-500">Cargos (5%)</span>
                        <span id="display-cargos" class="font-bold text-red-500">$0.00</span>
                    </div>

                    <div class="flex justify-between items-center pt-3 border-t border-dashed border-slate-200">
                        <span class="font-black text-slate-900 uppercase">Total</span>
                        <span id="display-total" class="font-black text-xl text-slate-900">$0.00</span>
                    </div>
                </div>
            `;

            recalculateTotal();
        }

        window.recalculateTotal = function () {
            const subtotal = parseFloat(document.getElementById('edit-subtotal').value) || 0;
            const metodo = document.getElementById('edit-payment-method').value;

            let cargos = 0;
            if (metodo !== 'Cash' && metodo) {
                cargos = subtotal * 0.05;
            }

            const total = subtotal + cargos;
            document.getElementById('display-cargos').innerText = '$' + cargos.toFixed(2);
            document.getElementById('display-total').innerText = '$' + total.toFixed(2);
            document.getElementById('btn-save').classList.remove('hidden');
        };

        window.saveOrderDetails = async function () {
            if (!currentOrderId) return;
            const subtotal = parseFloat(document.getElementById('edit-subtotal').value) || 0;
            const metodo = document.getElementById('edit-payment-method').value;
            let cargos = 0;
            if (metodo !== 'Cash') {
                cargos = subtotal * 0.05;
            }
            const total = subtotal + cargos;
            const status = document.getElementById('input-status').value;

            const payload = {
                status: status,
                subtotal: subtotal,
                total: total,
                payment_method_title: metodo
            };

            try {
                const res = await fetch(`${API_URL}?order_id=${currentOrderId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    alert('Guardado correctamente');
                    closeModal();
                    loadOrders();
                } else {
                    alert('Error guardando');
                }
            } catch (e) { console.error(e); alert('Error de red'); }
        };

        // Init
        loadOrders();
    </script>
</body>

</html>
