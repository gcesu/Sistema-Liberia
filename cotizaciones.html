    <script>
        (async function checkAuth() {
            const token = sessionStorage.getItem('session_token');
            if (!token) { window.location.href = '/login'; return; }
            try {
                const response = await fetch('api/check_session.php', { headers: { 'X-Session-Token': token } });
                const data = await response.json();
                if (!data.authenticated) { sessionStorage.removeItem('session_token'); window.location.href = '/login'; }
            } catch (error) { window.location.href = '/login'; }
        })();
    </script>

        // ── Helpers ──
        function getInitials(name) { if (!name) return '##'; const p = name.trim().split(' ').filter(Boolean); return p.length === 1 ? p[0][0].toUpperCase() : (p[0][0] + p[p.length - 1][0]).toUpperCase(); }
        function capitalizeName(name) { if (!name) return ''; return name.toLowerCase().split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' '); }
        function formatDateShort(d) { if (!d) return '---'; const months = ['ENE', 'FEB', 'MAR', 'ABR', 'MAY', 'JUN', 'JUL', 'AGO', 'SEP', 'OCT', 'NOV', 'DIC']; const s = String(d).split('T')[0]; const p = s.split('-'); if (p.length === 3) return `${parseInt(p[2])}/${months[parseInt(p[1]) - 1]}/${p[0]}`; return d; }
        function formatTime(t) { if (!t) return '--:--'; const m = String(t).match(/^(\d{1,2}):(\d{2})/); if (!m) return String(t); let h = parseInt(m[1]); const min = m[2], ampm = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return `${h}:${min} ${ampm}`; }
        function translateStatus(s) { return { pending: 'Pendiente', processing: 'En Proceso', 'on-hold': 'En Espera', completed: 'Completada', cancelled: 'Cancelada', failed: 'Fallida' }[s] || s; }
        function statusClass(s) { return { completed: 'status-completed', processing: 'status-processing', pending: 'status-pending', cancelled: 'status-cancelled', 'on-hold': 'status-on-hold', failed: 'status-failed' }[s] || 'status-pending'; }
        function getMeta(arr, key) { if (!Array.isArray(arr)) return null; const m = arr.find(x => x.key === key); return m ? (m.value ?? null) : null; }
        function normalizeForInput(val, type) { if (!val) return ''; if (type === 'date') return val.split('T')[0].split(' ')[0]; if (type === 'time') { const match = val.match(/(\d{1,2}):(\d{2})/); if (match) { let h = parseInt(match[1]); if (val.toLowerCase().includes('pm') && h < 12) h += 12; if (val.toLowerCase().includes('am') && h === 12) h = 0; return `${h.toString().padStart(2, '0')}:${match[2]}`; } } return val; }
        function autoResizeTextarea(textarea) { if (!textarea) return; textarea.style.overflowY = 'hidden'; textarea.style.height = 'auto'; textarea.style.height = `${Math.max(textarea.scrollHeight, 64)}px`; }
        function cleanDriverName(name) { if (!name) return ''; return name.replace(/\s*\(.*?\)\s*/g, '').trim(); }

        function esLineItemInterno(item) {
            if ((item.meta_data || []).some(m => m.key === KEY_PICKUP_LOC)) return true;
            const n = (item.name || '').toLowerCase();
            return ['one way shuttle', 'hotel-hotel', 'hotel to hotel', 'hotel – hotel', 'hotel - hotel'].some(x => n.includes(x));
        }

        // ── Load choferes ──
        async function loadChoferes() {
            try {
                const response = await fetch('api/choferes.php');
                if (response.ok) {
                    const data = await response.json();
                    CHOFERES = data.map(c => c.nombre);
                    data.forEach(c => { if (c.telefono) CHOFERES_PHONE[c.nombre] = c.telefono; });
                }
            } catch (err) { console.error('Error cargando choferes:', err); }
        }

        function initSearchableSelect(selectId) {
            const hiddenSelect = document.getElementById(selectId);
            if (!hiddenSelect) return;
            const currentValue = hiddenSelect.value || '';
            hiddenSelect.classList.add('hidden');
            const wrapper = document.createElement('div');
            wrapper.className = 'searchable-select-wrapper';
            const input = document.createElement('input');
            input.type = 'text'; input.className = 'input-editable bg-white'; input.placeholder = 'Buscar chofer...'; input.autocomplete = 'off'; input.value = currentValue;
            const dropdown = document.createElement('div');
            dropdown.className = 'searchable-select-dropdown hidden';
            wrapper.appendChild(input); wrapper.appendChild(dropdown);
            hiddenSelect.parentNode.insertBefore(wrapper, hiddenSelect);
            let activeIdx = -1;
            function renderOptions(filter = '') {
                const filterLower = filter.toLowerCase();
                const allOptions = [{ value: '', label: 'No asignado' }, ...CHOFERES.map(c => ({ value: c, label: c }))];
                const filtered = allOptions.filter(o => o.label.toLowerCase().includes(filterLower));
                dropdown.innerHTML = ''; activeIdx = -1;
                if (filtered.length === 0) { dropdown.innerHTML = '<div class="searchable-select-empty">Sin resultados</div>'; return; }
                filtered.forEach((opt) => {
                    const div = document.createElement('div');
                    div.className = 'searchable-select-option' + (opt.value === hiddenSelect.value ? ' selected' : '');
                    div.textContent = opt.label; div.dataset.value = opt.value;
                    div.addEventListener('mousedown', (e) => { e.preventDefault(); selectOption(opt.value, opt.label); });
                    dropdown.appendChild(div);
                });
            }
            function selectOption(value, label) { hiddenSelect.value = value; input.value = label === 'No asignado' ? '' : label; dropdown.classList.add('hidden'); hiddenSelect.dispatchEvent(new Event('change')); }
            input.addEventListener('focus', () => { input.select(); renderOptions(input.value); dropdown.classList.remove('hidden'); });
            input.addEventListener('input', () => { renderOptions(input.value); dropdown.classList.remove('hidden'); });
            input.addEventListener('blur', () => { setTimeout(() => { dropdown.classList.add('hidden'); input.value = hiddenSelect.value || ''; activeIdx = -1; }, 150); });
            input.addEventListener('keydown', (e) => {
                const items = dropdown.querySelectorAll('.searchable-select-option');
                if (items.length === 0) return;
                if (e.key === 'ArrowDown') { e.preventDefault(); activeIdx = Math.min(activeIdx + 1, items.length - 1); items.forEach((el, i) => el.classList.toggle('active', i === activeIdx)); items[activeIdx]?.scrollIntoView({ block: 'nearest' }); }
                else if (e.key === 'ArrowUp') { e.preventDefault(); activeIdx = Math.max(activeIdx - 1, 0); items.forEach((el, i) => el.classList.toggle('active', i === activeIdx)); items[activeIdx]?.scrollIntoView({ block: 'nearest' }); }
                else if (e.key === 'Enter') { e.preventDefault(); if (activeIdx >= 0 && items[activeIdx]) { selectOption(items[activeIdx].dataset.value, items[activeIdx].textContent); input.blur(); } }
                else if (e.key === 'Escape') { dropdown.classList.add('hidden'); input.blur(); }
            });
        }

        // ── Load orders ──
        async function loadOrders() {
            await loadChoferes();
            try {
                const res = await fetch(API_URL);
                if (!res.ok) throw new Error();
                allOrders = await res.json();
                renderTable();
            } catch {
                document.getElementById('table-body').innerHTML = `<tr><td colspan="6" class="text-center py-10 text-red-400 font-bold text-xs uppercase">Error cargando datos</td></tr>`;
            }
        }
        window.refreshData = () => loadOrders();

        // ── Table ──
        function renderTable() {
            const tbody = document.getElementById('table-body'); tbody.innerHTML = '';
            const start = (currentPage - 1) * itemsPerPage;
            const pageData = allOrders.slice(start, start + itemsPerPage);
            document.getElementById('total-count').textContent = allOrders.length;
            updatePagination();
            if (!pageData.length) { tbody.innerHTML = `<tr><td colspan="6" class="text-center py-12 text-gray-400 font-bold text-xs uppercase tracking-wider">No se encontraron cotizaciones</td></tr>`; return; }
            pageData.forEach(o => {
                const viajes = o.viajes || [];
                const sv = o.status_viaje || o.status;
                const rawName = [o.billing?.last_name, o.billing?.first_name].filter(Boolean).join(' ') || `Cotización #${o.id}`;
                const name = capitalizeName(rawName);
                const tripBadges = viajes.map(v => {
                    const cls = v.tipo === 'llegada' ? 'badge-llegada' : v.tipo === 'salida' ? 'badge-salida' : 'badge-interno';
                    const label = v.tipo === 'llegada' ? 'Llegada' : v.tipo === 'salida' ? 'Salida' : 'Interno';
                    return `<span class="trip-badge ${cls}">${label}</span>`;
                }).join(' ');
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td data-label="ID" class="pl-6"><div class="font-bold text-[#002a3f]">#${o.id}</div><div class="text-xs text-gray-400 font-bold">${formatDateShort(o.date_created)}</div></td>
                    <td data-label="Cliente"><div class="flex items-center"><div class="client-avatar">${getInitials(name)}</div><div><div class="font-bold text-[#002a3f]">${name}</div><div class="text-xs text-gray-400">${o.billing?.email || ''}</div></div></div></td>
                    <td data-label="Viajes"><div class="flex flex-wrap gap-1">${tripBadges || '<span class="text-gray-400 text-xs">Sin viajes</span>'}</div></td>
                    <td data-label="Total" class="font-bold font-mono text-[#002a3f]">$${parseFloat(o.total || 0).toFixed(2)}</td>
                    <td data-label="Status"><span class="status-pill ${statusClass(sv)}"><span class="status-dot"></span>${translateStatus(sv)}</span></td>
                    <td data-label="Acción" class="pr-6 text-right"><button onclick="viewOrder(${o.id})" class="bg-[#002a3f] text-white px-4 py-2 rounded-lg font-bold uppercase text-xs hover:bg-[#ed4441] transition-all">VER</button></td>`;
                tbody.appendChild(tr);
            });
        }

        // ── Pagination ──
        function updatePagination() {
            const total = allOrders.length; const totalPages = Math.ceil(total / itemsPerPage) || 1;
            const start = (currentPage - 1) * itemsPerPage + 1, end = Math.min(currentPage * itemsPerPage, total);
            document.getElementById('pagination-info').textContent = `Mostrando ${total === 0 ? 0 : start}–${end} de ${total}`;
            const ctrl = document.getElementById('pagination-controls'); ctrl.innerHTML = '';
            if (totalPages <= 1) return;
            const mk = (lbl, fn, act = false) => { const b = document.createElement('button'); b.className = `pagination-btn${act ? ' active' : ''}`; b.textContent = lbl; b.onclick = fn; ctrl.appendChild(b); };
            if (currentPage > 1) mk('◀', () => goToPage(currentPage - 1));
            for (let i = Math.max(1, currentPage - 2); i <= Math.min(totalPages, currentPage + 2); i++) mk(i, () => goToPage(i), i === currentPage);
            if (currentPage < totalPages) mk('▶', () => goToPage(currentPage + 1));
        }
        function goToPage(p) { currentPage = p; renderTable(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

        // ── View Order (Modal) ──
        function viewOrder(id) {
            const o = allOrders.find(x => x.id === id);
            if (!o) return;
            currentOrderId = id;
            currentOrderViajes = [];
            originalViajeValues = {};

            let rawOrder = null;
            try { rawOrder = typeof o.raw_data === 'string' ? JSON.parse(o.raw_data) : o.raw_data; } catch { }

            document.body.style.overflow = 'hidden';
            document.getElementById('order-modal').classList.add('open');
            document.getElementById('btn-save').classList.add('hidden');

            document.getElementById('modal-title').textContent = `Cotización #${o.id}`;
            const sv = o.status_viaje || o.status;
            const pill = document.getElementById('modal-status-pill');
            pill.className = `status-pill ${statusClass(sv)}`; pill.innerHTML = `<span class="status-dot"></span> ${translateStatus(sv)}`;

            const rawName = [o.billing?.last_name, o.billing?.first_name].filter(Boolean).join(' ') || `Cotización #${o.id}`;
            const name = capitalizeName(rawName);
            const email = (o.billing?.email || '').toLowerCase();
            const phone = o.billing?.phone || '';
            const country = (o.billing?.country || '').toUpperCase();
            const address = o.billing?.address_1 || o.cliente_direccion || '';

            document.getElementById('modal-client-name').textContent = name;
            document.getElementById('modal-email').textContent = email || '---';
            document.getElementById('modal-phone').textContent = phone || '---';
            document.getElementById('modal-country').textContent = COUNTRY_MAP[country] || country || '---';
            document.getElementById('modal-address').textContent = address || '---';
            document.getElementById('modal-email-btn').href = `mailto:${email}`;
            document.getElementById('modal-whatsapp-btn').href = PhoneUtils.buildWhatsappUrl(phone, country);

            const note = o.customer_note || '';
            const noteC = document.getElementById('modal-note-container');
            if (note.trim()) { document.getElementById('modal-note').textContent = note; noteC.classList.remove('hidden'); }
            else noteC.classList.add('hidden');

            document.getElementById('input-status-viaje').value = sv;
            originalStatusViaje = sv;

            // ── Enrich viajes with raw_data ──
            const viajesDB = o.viajes || [];
            const lineItemsRaw = rawOrder?.line_items || [];

            const viajes = viajesDB.map(v => {
                if (v.tipo !== 'interno') {
                    return { ...v, destino_display: v.destino || v.hotel || '' };
                }
                // Parse route from DB fields (hotel or destino contain "Pickup → Dropoff")
                const routeStr = v.destino || v.hotel || '';
                const routeParts = routeStr.includes('→') ? routeStr.split('→') : [];
                const dbPickup = routeParts[0]?.trim() || '';
                const dbDropoff = routeParts[1]?.trim() || '';

                // Try to get richer data from raw_data line_item meta
                const li = lineItemsRaw[v.item_index] || lineItemsRaw.find(l => esLineItemInterno(l));
                if (li) {
                    const meta = li.meta_data || [];
                    // getMeta with display_value fallback for WCCPF plugin
                    const getVal = (key) => {
                        const m = meta.find(x => x.key === key);
                        if (!m) return '';
                        const val = m.value ?? m.display_value ?? '';
                        return (typeof val === 'string' ? val : String(val)).trim();
                    };
                    const pickup = getVal(KEY_PICKUP_LOC) || dbPickup;
                    const dropoff = getVal(KEY_DROPOFF_LOC) || dbDropoff;
                    const fecha = getVal(KEY_PICKUP_DATE) || v.fecha;
                    const hora = getVal(KEY_PICKUP_TIME) || v.hora;
                    const pax = parseInt(getVal(KEY_PAX) || v.pax || '1');
                    return { ...v, pickup, dropoff, fecha, hora, pax };
                }
                // Fallback: use DB fields
                return { ...v, pickup: dbPickup, dropoff: dbDropoff };
            });

            // Sort: llegada → interno → salida
            const typeOrder = { llegada: 0, interno: 1, salida: 2 };
            const sorted = [...viajes].sort((a, b) => (typeOrder[a.tipo] ?? 9) - (typeOrder[b.tipo] ?? 9));

            currentOrderViajes = sorted;

            // ── Route banners ──
            const routeStack = document.getElementById('route-stack'); routeStack.innerHTML = '';
            sorted.forEach(v => {
                let oi = '✈️', on = 'Aeropuerto LIR', di = '🏨', dn = 'Hotel';
                if (v.tipo === 'llegada') { oi = '🛬'; on = 'Aeropuerto LIR'; di = '🏨'; dn = v.destino_display || v.destino || 'Hotel'; }
                else if (v.tipo === 'salida') { oi = '🏨'; on = v.destino_display || v.destino || 'Hotel'; di = '🛫'; dn = 'Aeropuerto LIR'; }
                else { oi = '🏨'; on = v.pickup || 'Hotel Origen'; di = '🏨'; dn = v.dropoff || 'Hotel Destino'; }
                const card = document.createElement('div'); card.className = 'route-visualizer';
                card.innerHTML = `<div class="route-point"><span style="font-size:2rem">${oi}</span><span class="route-point-label">Origen</span><span class="route-point-name">${on}</span></div><div style="font-size:1.75rem">➡️</div><div class="route-point"><span style="font-size:2rem">${di}</span><span class="route-point-label">Destino</span><span class="route-point-name">${dn}</span></div>`;
                routeStack.appendChild(card);
            });

            // ── Pills ──
            const nL = sorted.filter(v => v.tipo === 'llegada').length;
            const nS = sorted.filter(v => v.tipo === 'salida').length;
            const nI = sorted.filter(v => v.tipo === 'interno').length;
            const total = sorted.length;
            let tipoLabel = total === 1 ? (nL ? 'Solo Llegada' : nS ? 'Solo Salida' : 'Viaje Interno') : (nL && nS && !nI ? 'Ida y Vuelta' : `${total} Viajes`);
            document.getElementById('pill-tipo').textContent = tipoLabel;
            document.getElementById('pill-pax').textContent = sorted.reduce((mx, v) => Math.max(mx, v.pax || 1), 1);

            // ── Viaje cards (matching reservas style) ──
            renderViajeCards(sorted, o);

            // ── Financial ──
            renderFinancial(o, rawOrder);

            document.querySelectorAll('#modal-box .modal-main-content, #modal-box .modal-sidebar').forEach(el => el.scrollTop = 0);
        }

                                    <textarea id="input-${prefix}_notas_internas" oninput="checkForChanges(); autoResizeTextarea(this)" rows="2" class="input-editable bg-white resize-none h-16">${v.notas_internas || ''}</textarea>
                                </div>
                                <div class="flex flex-wrap gap-2 mt-3 pt-3 border-t border-dashed ${bgBorder}">
                                    <button onclick="sendViajeEmail(${order.id}, ${viajeId})" class="flex-1 px-3 py-2 bg-blue-500 hover:bg-blue-600 text-white text-[10px] font-bold uppercase tracking-wider rounded-lg transition-all shadow-sm flex items-center justify-center gap-1">Recordatorio Correo</button>
                                    <button onclick="sendViajeWhatsApp(${order.id}, ${viajeId})" class="flex-1 px-3 py-2 bg-green-500 hover:bg-green-600 text-white text-[10px] font-bold uppercase tracking-wider rounded-lg transition-all shadow-sm flex items-center justify-center gap-1">Recordatorio WhatsApp</button>
                                    <button onclick="sendDriverContact(${order.id}, ${viajeId})" class="flex-1 px-3 py-2 bg-amber-500 hover:bg-amber-600 text-white text-[10px] font-bold uppercase tracking-wider rounded-lg transition-all shadow-sm flex items-center justify-center gap-1">📞 Contacto Chofer</button>
                                </div>
                            </div>
                        </div>
                    </div>`;
                container.appendChild(card);

                // Init searchable select for chofer
                initSearchableSelect(`input-${prefix}_chofer`);
                // Auto-resize textareas
                requestAnimationFrame(() => {
                    autoResizeTextarea(document.getElementById(`input-${prefix}_nota_choferes`));
                    autoResizeTextarea(document.getElementById(`input-${prefix}_notas_internas`));
                });
            });
        }

        function toggleViajeEdit(prefix) {
            const btn = document.getElementById(`btn-edit-${prefix}`);
            const isEditing = btn.classList.contains('editing');
            const fieldKeys = ['fecha', 'hora', 'vuelo', 'hotel'];
            fieldKeys.forEach(k => {
                const display = document.getElementById(`display-${prefix}_${k}`);
                const input = document.getElementById(`input-${prefix}_${k}`);
                if (display) display.classList.toggle('hidden', !isEditing);
                if (input) input.classList.toggle('hidden', isEditing);
            });
            btn.innerText = isEditing ? 'Editar' : 'Cancelar';
            btn.classList.toggle('editing', !isEditing);
            checkForChanges();
        }

        // ── Message functions ──
        function sendViajeEmail(orderId, viajeId) {
            const order = allOrders.find(o => o.id === orderId);
            if (!order) return;
            const viaje = currentOrderViajes.find(v => v.id === viajeId);
            if (!viaje) return;
            const email = (order.billing?.email || '').toLowerCase();
            // Simple mailto for now
            const subject = `Cotización #${orderId} - Recordatorio`;
            window.open(`mailto:${email}?subject=${encodeURIComponent(subject)}`);
        }

        function sendViajeWhatsApp(orderId, viajeId) {
            const order = allOrders.find(o => o.id === orderId);
            if (!order) return;
            const phone = order.billing?.phone || '';
            const country = order.billing?.country || '';
            const whatsappUrl = PhoneUtils.buildWhatsappUrl(phone, country);
            if (whatsappUrl) window.open(whatsappUrl, '_blank');
        }

        function sendDriverContact(orderId, viajeId) {
            const viaje = currentOrderViajes.find(v => v.id === viajeId);
            if (!viaje) return;
            const choferName = viaje.chofer || document.getElementById(`input-cot_viaje_${viajeId}_chofer`)?.value || '';
            if (!choferName) { alert('No hay chofer asignado a este viaje.'); return; }
            const phone = CHOFERES_PHONE[choferName];
            if (!phone) { alert(`No se encontró teléfono para el chofer "${choferName}".`); return; }
            const order = allOrders.find(o => o.id === orderId);
            if (!order) return;
            const cleanPhone = phone.replace(/[\s\-]/g, '');
            const displayName = cleanDriverName(choferName);
            const firstName = (order.billing?.first_name || order.billing?.last_name || '').trim();
            const msg = `Hi ${firstName},\n\nThis is your driver's WhatsApp for tomorrow: wa.me/${cleanPhone}, or if you need to call him directly: ${phone}. His name is ${displayName}. Please use this number only in case of an emergency. See you tomorrow!\n\nBest regards,\nMónica B.`;
            const whatsappUrl = PhoneUtils.buildWhatsappUrl(order.billing?.phone || '', order.billing?.country || '', msg);
            if (whatsappUrl) window.open(whatsappUrl, '_blank');
        }

        // ── Financial ──
        function renderFinancial(o, rawOrder) {
            const container = document.getElementById('financial-breakdown'); container.innerHTML = '';
            const addRow = (label, value, bold = false, discount = false) => {
                const num = parseFloat(value); if (isNaN(num) || num === 0) return;
                const fmt = discount ? `-$${Math.abs(num).toFixed(2)}` : `$${num.toFixed(2)}`;
                const col = discount ? 'text-green-600' : 'text-[#002a3f]';
                container.innerHTML += `<div class="fin-row ${bold ? 'pt-3 border-t border-dashed border-gray-200 mt-2' : 'text-sm'}"><span class="font-bold uppercase opacity-50 text-[10px] tracking-widest">${label}</span><span class="font-bold ${bold ? 'text-2xl' : 'text-base'} ${col}">${fmt}</span></div>`;
            };
            if (o.payment_method_title) container.innerHTML += `<div class="text-[10px] uppercase font-black text-gray-400 mb-4 border-b pb-2">Método: ${o.payment_method_title}</div>`;
            const lis = rawOrder?.line_items || [];
            const sub = lis.length ? lis.reduce((s, li) => s + parseFloat(li.subtotal || 0), 0) : parseFloat(o.subtotal || 0);
            addRow('Subtotal Servicios', sub, true);
            (rawOrder?.fee_lines || []).forEach(f => addRow(f.name || 'Cargo', f.total));
            (rawOrder?.tax_lines || []).forEach(t => addRow(t.label || 'Impuesto', t.tax_total));
            (rawOrder?.coupon_lines || []).forEach(c => addRow(`Cupón: ${c.code}`, c.discount, false, true));
            addRow('Total', o.total);
        }

        // ── Check for changes ──
        function checkForChanges() {
            let changed = document.getElementById('input-status-viaje').value !== originalStatusViaje;

            if (!changed) {
                for (const v of currentOrderViajes) {
                    const prefix = `cot_viaje_${v.id}`;
                    const fields = ['chofer', 'subchofer', 'nota_choferes', 'notas_internas', 'fecha', 'hora', 'vuelo', 'hotel'];
                    for (const f of fields) {
                        const inp = document.getElementById(`input-${prefix}_${f}`);
                        if (inp) {
                            const original = originalViajeValues[`${prefix}_${f}`] || '';
                            const current = inp.value;
                            if (current !== original && current !== normalizeForInput(original, f === 'fecha' ? 'date' : (f === 'hora' ? 'time' : 'text'))) {
                                changed = true; break;
                            }
                        }
                    }
                    if (changed) break;
                }
            }

            document.getElementById('btn-save').classList.toggle('hidden', !changed);
        }

        // ── Save ──
        async function saveChanges() {
            if (!currentOrderId) return;
            const btn = document.getElementById('btn-save');
            btn.disabled = true; btn.textContent = 'Guardando...';
            const newStatus = document.getElementById('input-status-viaje').value;

            try {
                // 1. Save status
                if (newStatus !== originalStatusViaje) {
                    const res = await fetch(`${API_URL}?order_id=${currentOrderId}`, {
                        method: 'PUT', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ status_viaje: newStatus })
                    });
                    if (!res.ok) throw new Error('Error saving status');
                    const idx = allOrders.findIndex(o => o.id === currentOrderId);
                    if (idx !== -1) allOrders[idx].status_viaje = newStatus;
                    originalStatusViaje = newStatus;
                }

                // 2. Save viaje changes
                for (const v of currentOrderViajes) {
                    const prefix = `cot_viaje_${v.id}`;
                    const viajePayload = {};
                    let viajeChanged = false;
                    const fieldsMap = { chofer: 'chofer', subchofer: 'subchofer', nota_choferes: 'nota_choferes', notas_internas: 'notas_internas', fecha: 'fecha', hora: 'hora', vuelo: 'vuelo', hotel: 'hotel' };
                    for (const [fieldKey, apiKey] of Object.entries(fieldsMap)) {
                        const inp = document.getElementById(`input-${prefix}_${fieldKey}`);
                        if (inp) {
                            const original = originalViajeValues[`${prefix}_${fieldKey}`] || '';
                            if (inp.value !== original && inp.value !== normalizeForInput(original, fieldKey === 'fecha' ? 'date' : (fieldKey === 'hora' ? 'time' : 'text'))) {
                                viajePayload[apiKey] = inp.value;
                                viajeChanged = true;
                            }
                        }
                    }
                    if (viajeChanged && v.id) {
                        const vResp = await fetch(`${VIAJES_API}?viaje_id=${v.id}`, {
                            method: 'PUT', headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(viajePayload)
                        });
                        if (!vResp.ok) throw new Error(`Error saving viaje ${v.id}`);
                        // Update originals
                        for (const [fieldKey] of Object.entries(fieldsMap)) {
                            const inp = document.getElementById(`input-${prefix}_${fieldKey}`);
                            if (inp) originalViajeValues[`${prefix}_${fieldKey}`] = inp.value;
                        }
                    }
                }

                // Update UI
                btn.classList.add('hidden');
                const pill = document.getElementById('modal-status-pill');
                pill.className = `status-pill ${statusClass(newStatus)}`;
                pill.innerHTML = `<span class="status-dot"></span> ${translateStatus(newStatus)}`;
                renderTable();
            } catch (e) {
                console.error(e);
                alert('Error al guardar: ' + e.message);
            } finally { btn.disabled = false; btn.textContent = 'Guardar Cambios'; }
        }

        // ── Close ──
        function closeModal() { document.getElementById('order-modal').classList.remove('open'); document.body.style.overflow = ''; }
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

        loadOrders();
    </script>
</body>

</html>
