<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotizaciones - Sistema Liberia</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&family=Oswald:wght@400;700&display=swap"
        rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- VERIFICACIÓN DE SESIÓN -->
    <script>
        (async function checkAuth() {
            const token = sessionStorage.getItem('session_token');
            if (!token) { window.location.href = '/login'; return; }
            try {
                const response = await fetch('api/check_session.php', {
                    headers: { 'X-Session-Token': token }
                });
                const data = await response.json();
                if (!data.authenticated) {
                    sessionStorage.removeItem('session_token');
                    window.location.href = '/login';
                }
            } catch (error) {
                console.error('Error verificando sesión:', error);
                window.location.href = '/login';
            }
        })();
    </script>

    <script src="menu.js" defer></script>

    <style>
        :root {
            --primary: #002a3f;
            --secondary: #ffffff;
            --accent: #ed4441;
            --bg-light: #f1f5f9;
        }

        body {
            font-family: 'Lato', sans-serif;
            background-color: var(--bg-light);
            color: #333;
            margin: 0;
            -webkit-font-smoothing: antialiased;
            font-size: 15px;
        }

        h1, h2, h3, .title-font {
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        .main-container {
            width: 100%;
            padding: 18px 18px 32px;
            max-width: none;
            margin: 0;
        }

        @media (max-width: 768px) {
            .main-container { padding: 12px; }
        }

        @media (min-width: 768px) {
            .main-container { padding: 30px; }
        }

        table { width: 100%; border-collapse: collapse; }

        thead th {
            background-color: #f8fafc;
            padding: 16px 20px;
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            color: #64748b;
            border-bottom: 2px solid #e2e8f0;
            text-align: left;
            letter-spacing: 1px;
        }

        tbody tr {
            background: white;
            border-bottom: 1px solid #e2e8f0;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        tbody tr:hover { background: #f8fafc; }

        td {
            padding: 16px 20px;
            font-size: 15px;
            color: #334155;
            vertical-align: middle;
        }

        .status-pill {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.5px;
        }

        .status-completed { background: #dcfce7; color: #166534; }
        .status-processing { background: #fef9c3; color: #854d0e; }
        .status-on-hold { background: #ffedd5; color: #9a3412; }
        .status-pending { background: #fef3c7; color: #92400e; }
        .status-cancelled, .status-failed { background: #fee2e2; color: #991b1b; }

        /* Modal */
        #modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
        }

        #modal-box {
            background: white;
            width: 95vw;
            height: 90vh;
            max-width: 1100px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Trip table in modal */
        .trip-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .trip-table th {
            background: #f1f5f9;
            padding: 10px 14px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            color: #64748b;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #e2e8f0;
        }

        .trip-table td {
            padding: 12px 14px;
            border-bottom: 1px solid #f1f5f9;
            font-size: 14px;
        }

        .trip-table tr:last-child td { border-bottom: none; }

        .trip-type-pill {
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .trip-type-llegada { background: #dbeafe; color: #1e40af; }
        .trip-type-salida { background: #fce7f3; color: #9d174d; }
        .trip-type-interno { background: #fef3c7; color: #92400e; }

        .meta-field-label {
            display: block;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            color: #94a3b8;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .meta-field-value {
            font-size: 15px;
            font-weight: 700;
            color: #1e293b;
        }

        .subtotal-input {
            width: 90px;
            text-align: right;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 4px 8px;
            font-weight: 700;
            font-size: 14px;
            color: #1e293b;
            background: #fefce8;
        }

        .subtotal-input:focus {
            outline: none;
            border-color: #f59e0b;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15);
        }
    </style>
</head>

<body>

    <admin-navbar></admin-navbar>

    <main class="main-container">
        <!-- Header -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
            <div>
                <h1 class="text-3xl font-bold text-slate-900 tracking-tight">Cotizaciones</h1>
            </div>
        </div>

        <!-- Tabla -->
        <div class="glass-panel overflow-hidden shadow-sm">
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <thead>
                        <tr>
                            <th>ID / Fecha</th>
                            <th>Cliente</th>
                            <th>Viajes</th>

                        </tr>

                <div class="flex gap-2">
                    <button onclick="prevPage()" class="p-2 hover:bg-white rounded-lg text-slate-400 hover:text-slate-600 transition-colors">◀</button>
                    <button onclick="nextPage()" class="p-2 hover:bg-white rounded-lg text-slate-400 hover:text-slate-600 transition-colors">▶</button>

    <!-- Modal de Detalles -->
    <div id="modal-overlay">
        <div id="modal-box">
            <!-- Modal Header -->
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <div>
                    <h2 class="text-xl font-bold text-slate-800 flex items-center gap-3">
                        <span id="modal-order-id">#0000</span>
                        <span id="modal-order-status" class="status-pill status-processing">Status</span>
                    </h2>
                </div>
                <button onclick="closeModal()"

            <!-- Modal Body -->
            <div class="flex-1 overflow-y-auto p-6 bg-slate-50/50">
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <!-- Columna Izquierda: Viajes + Cliente -->
                    <div class="lg:col-span-2 space-y-6">
                        <!-- Tabla de Viajes -->
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                            <h3 class="text-sm font-black text-slate-400 uppercase tracking-widest mb-4 border-b pb-2">
                                Viajes de la Reserva</h3>
                            <div class="overflow-x-auto">
                                <table class="trip-table">
                                    <thead>
                                        <tr>
                                            <th>#</th>
                                            <th>Tipo</th>
                                            <th>Ruta</th>
                                            <th>Fecha</th>
                                            <th>Hora</th>
                                            <th>Pax</th>
                                            <th class="text-right">Subtotal</th>
                                        </tr>
                                    </thead>
                                    <tbody id="modal-trips-body">
                                    </tbody>
                                </table>

                        <!-- Cliente -->
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                            <h3 class="text-sm font-black text-slate-400 uppercase tracking-widest mb-4 border-b pb-2">
                                Cliente</h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-y-4 gap-x-8" id="modal-customer-details">
                            </div>
                        </div>
                    </div>

                    <!-- Columna Derecha: Financiero + Acciones -->
                    <div class="space-y-6">
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 border-l-4 border-l-blue-500">
                            <h3 class="text-sm font-black text-slate-400 uppercase tracking-widest mb-4">Resumen Financiero</h3>
                            <div id="payment-breakdown-list">
                            </div>
                        </div>

                        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                            <h3 class="text-sm font-black text-slate-400 uppercase tracking-widest mb-4">Acciones</h3>
                            <div class="space-y-3">
                                <label class="block text-xs font-bold text-slate-400 uppercase">Estado de Cotización</label>
                                <select id="input-status-viaje"
                                    class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm font-bold text-slate-700 focus:border-blue-500 outline-none"

                                    <option value="pending">Pendiente</option>
                                    <option value="processing">En Proceso</option>

                                <p class="text-[10px] text-slate-400">Los viajes aparecerán en la ventana de Viajes solo cuando el estado sea <strong>Completada</strong>.</p>

                                <button id="btn-save" onclick="saveOrderDetails()"
                                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-lg shadow-blue-500/30 transition-all mt-4 hidden">

    <!-- Scripts -->
    <script>
        const API_URL = 'api/cotizaciones.php';

        let allOrders = [];
        let currentFilteredOrders = [];
        let currentPage = 1;
        const itemsPerPage = 20;
        let currentOrderId = null;
        let currentOrderData = null;

        // Helpers
        const formatDate = (dateStr) => {
            if (!dateStr) return '-';
            const date = new Date(dateStr);
            return new Intl.DateTimeFormat('es-CR', {
                day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'
            }).format(date);
        };

        const translateStatus = (s) => {
            const map = {
                'pending': 'Pendiente',
                'processing': 'En Proceso',
                'on-hold': 'En Espera',
                'completed': 'Completada',
                'cancelled': 'Cancelada',
                'failed': 'Fallida'
            };
            return map[s] || s;
        };

        const statusClass = (s) => {
            const map = {
                'completed': 'status-completed',
                'processing': 'status-processing',
                'pending': 'status-pending',
                'cancelled': 'status-cancelled',
                'on-hold': 'status-on-hold',
                'failed': 'status-failed'
            };
            return map[s] || 'bg-slate-100 text-slate-500';
        };

        const tripTypeLabel = (t) => {
            const map = { 'llegada': '✈️ Llegada', 'salida': '🛫 Salida', 'interno': '🚐 Interno' };
            return map[t] || t;
        };

        const tripTypeClass = (t) => {
            return `trip-type-${t}` || 'trip-type-interno';
        };

        // Cargar Datos
        async function loadOrders() {
            try {
                const res = await fetch(API_URL);
                if (!res.ok) throw new Error('Error fetching data');
                allOrders = await res.json();
                currentFilteredOrders = [...allOrders];
                renderTable();
            } catch (err) {
                console.error(err);
                document.getElementById('orders-table-body').innerHTML = `<tr><td colspan="6" class="text-center py-8 text-red-500">Error cargando datos.</td></tr>`;
            }
        }

        // Render Tabla
        function renderTable() {
            const tbody = document.getElementById('orders-table-body');
            tbody.innerHTML = '';

            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageData = currentFilteredOrders.slice(start, end);

            document.getElementById('pagination-info').innerText =
                `Mostrando ${currentFilteredOrders.length === 0 ? 0 : start + 1}-${Math.min(end, currentFilteredOrders.length)} de ${currentFilteredOrders.length}`;

            if (pageData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-12 text-slate-400 italic">No se encontraron cotizaciones</td></tr>`;
                return;
            }

            pageData.forEach(o => {
                const viajes = o.viajes || [];
                // Build a summary of trip types
                const tripSummary = viajes.map(v => {
                    const typeClass = tripTypeClass(v.tipo);
                    const label = v.tipo === 'interno' ? 'Interno' : v.tipo === 'llegada' ? 'Llegada' : 'Salida';
                    return `<span class="trip-type-pill ${typeClass}">${label}</span>`;
                }).join(' ');

                const statusViaje = o.status_viaje || o.status;

                const tr = document.createElement('tr');
                tr.onclick = () => viewOrder(o.id);
                tr.innerHTML = `
                    <td>
                        <div class="font-bold text-slate-900">#${o.id}</div>
                        <div class="text-xs text-slate-400">${formatDate(o.date_created)}</div>
                    </td>
                    <td>
                        <div class="font-bold text-slate-800">${o.billing.last_name || ''}</div>
                        <div class="text-xs text-slate-500">${o.billing.email || ''}</div>
                    </td>
                    <td>
                        <div class="flex flex-wrap gap-1">${tripSummary || '<span class="text-slate-400 text-xs">Sin viajes</span>'}</div>
                        <div class="text-xs text-slate-400 mt-1">${o.origen || ''} → ${o.hotel_nombre || ''}</div>
                    </td>
                    <td class="text-right font-mono font-bold text-slate-700">$${parseFloat(o.total).toFixed(2)}</td>
                    <td class="text-center">
                        <span class="status-pill ${statusClass(statusViaje)}">${translateStatus(statusViaje)}</span>
                    </td>
                    <td class="text-center">
                        <button onclick="event.stopPropagation(); viewOrder(${o.id})" class="text-blue-600 hover:text-blue-800 font-bold text-xs bg-blue-50 hover:bg-blue-100 px-3 py-1.5 rounded-lg transition-colors">
                            VER
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Pagination
        window.prevPage = () => { if (currentPage > 1) { currentPage--; renderTable(); } };
        window.nextPage = () => { if (currentPage * itemsPerPage < currentFilteredOrders.length) { currentPage++; renderTable(); } };

        // Modal
        window.viewOrder = (id) => {
            currentOrderId = id;
            const o = allOrders.find(x => x.id === id);
            if (!o) return;
            currentOrderData = o;

            document.getElementById('modal-overlay').style.display = 'flex';
            document.getElementById('modal-order-id').innerText = `#${o.id}`;

            const sv = o.status_viaje || o.status;
            document.getElementById('modal-order-status').className = `status-pill ${statusClass(sv)}`;
            document.getElementById('modal-order-status').innerText = translateStatus(sv);
            document.getElementById('input-status-viaje').value = sv;

            // Render Trips Table
            renderTripsTable(o);

            // Render Customer
            document.getElementById('modal-customer-details').innerHTML = `
                <div>
                    <span class="meta-field-label">Nombre</span>
                    <div class="meta-field-value">${o.billing.last_name || '-'}</div>
                </div>
                <div>
                    <span class="meta-field-label">Email</span>
                    <div class="meta-field-value text-blue-600">${o.billing.email || '-'}</div>
                </div>
                <div>
                    <span class="meta-field-label">Teléfono</span>
                    <div class="meta-field-value">${o.billing.phone || '-'}</div>
                </div>
                <div>
                    <span class="meta-field-label">País</span>
                    <div class="meta-field-value">${o.billing.country || '-'}</div>
                </div>
            `;

            // Render Financial Summary
            renderPaymentInfo(o);
        };

        function renderTripsTable(o) {
            const tbody = document.getElementById('modal-trips-body');
            const viajes = o.viajes || [];

            if (viajes.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center py-6 text-slate-400 italic text-sm">No hay viajes registrados para esta cotización</td></tr>`;
                return;
            }

            tbody.innerHTML = viajes.map((v, i) => {
                const isInterno = v.tipo === 'interno';
                const ruta = v.hotel || '-';
                const fecha = v.fecha || '-';
                const hora = v.hora ? v.hora.substring(0, 5) : '-';
                const subtotalVal = parseFloat(v.subtotal) || 0;

                // For internal trips, show editable input. For normal trips, show the subtotal from WooCommerce line_items
                let subtotalCell;
                if (isInterno) {
                    subtotalCell = `<input type="number" step="0.01" class="subtotal-input" 
                        id="trip-subtotal-${v.id}" value="${subtotalVal.toFixed(2)}" 
                        oninput="recalculateTotal()" placeholder="0.00">`;
                } else {
                    // Try to get the subtotal from line_items
                    const lineItems = o.line_items || [];
                    const itemSubtotal = lineItems[v.item_index] ? parseFloat(lineItems[v.item_index].subtotal || 0) : subtotalVal;
                    subtotalCell = `<span class="font-mono font-bold text-slate-600">$${itemSubtotal.toFixed(2)}</span>`;
                }

                return `
                    <tr>
                        <td class="font-bold text-slate-400">${i + 1}</td>
                        <td><span class="trip-type-pill ${tripTypeClass(v.tipo)}">${tripTypeLabel(v.tipo)}</span></td>
                        <td class="font-bold text-slate-700 text-sm">${ruta}</td>
                        <td class="font-mono text-slate-600">${fecha}</td>
                        <td class="font-mono text-slate-600">${hora}</td>
                        <td class="text-center font-bold text-slate-600">${v.pax || 1}</td>
                        <td class="text-right">${subtotalCell}</td>
                    </tr>
                `;
            }).join('');
        }

        // Financial Logic
        function renderPaymentInfo(o) {
            const container = document.getElementById('payment-breakdown-list');
            const paymentMethods = ['Cash', 'Credit Card', 'Paypal', 'Bank Transfer'];

            let paymentSelect = `<select id="edit-payment-method" class="w-full bg-slate-50 border border-slate-200 rounded px-2 py-1 text-sm mb-4" onchange="recalculateTotal()">`;
            paymentMethods.forEach(pm => {
                const selected = (o.payment_method_title === pm) ? 'selected' : '';
                paymentSelect += `<option value="${pm}" ${selected}>${pm}</option>`;
            });
            paymentSelect += `</select>`;

            container.innerHTML = `
                <div class="mb-2">
                    <label class="block text-[10px] uppercase font-bold text-slate-400">Método de Pago</label>
                    ${paymentSelect}
                </div>
                
                <div class="space-y-3">
                    <div class="flex justify-between items-center text-sm">
                        <span class="font-bold text-slate-500">Subtotal Viajes</span>
                        <span id="display-subtotal" class="font-bold text-slate-700">$0.00</span>
                    </div>
                    
                    <div class="flex justify-between items-center text-sm">
                        <span class="font-bold text-slate-500">Cargos (5%)</span>
                        <span id="display-cargos" class="font-bold text-red-500">$0.00</span>
                    </div>

                    <div class="flex justify-between items-center pt-3 border-t border-dashed border-slate-200">
                        <span class="font-black text-slate-900 uppercase">Total</span>
                        <span id="display-total" class="font-black text-xl text-slate-900">$0.00</span>
                    </div>
                </div>
            `;

            recalculateTotal();
        }

        window.recalculateTotal = function () {
            if (!currentOrderData) return;
            const viajes = currentOrderData.viajes || [];
            const lineItems = currentOrderData.line_items || [];

            let subtotal = 0;

            viajes.forEach(v => {
                if (v.tipo === 'interno') {
                    // Editable: get from input
                    const input = document.getElementById(`trip-subtotal-${v.id}`);
                    subtotal += input ? (parseFloat(input.value) || 0) : 0;
                } else {
                    // Fixed: get from line_items
                    const li = lineItems[v.item_index];
                    subtotal += li ? (parseFloat(li.subtotal) || 0) : (parseFloat(v.subtotal) || 0);
                }
            });

            const metodo = document.getElementById('edit-payment-method')?.value || '';
            let cargos = 0;
            if (metodo !== 'Cash' && metodo) {
                cargos = subtotal * 0.05;
            }

            const total = subtotal + cargos;
            document.getElementById('display-subtotal').innerText = '$' + subtotal.toFixed(2);
            document.getElementById('display-cargos').innerText = '$' + cargos.toFixed(2);
            document.getElementById('display-total').innerText = '$' + total.toFixed(2);

            showSaveBtn();
        };

        window.showSaveBtn = function () {
            document.getElementById('btn-save').classList.remove('hidden');
        };

        window.closeModal = () => {
            document.getElementById('modal-overlay').style.display = 'none';
            document.getElementById('btn-save').classList.add('hidden');
        };

        window.saveOrderDetails = async function () {
            if (!currentOrderId || !currentOrderData) return;

            const btn = document.getElementById('btn-save');
            btn.disabled = true;
            btn.innerHTML = '⏳ Guardando...';

            try {
                // Calculate totals
                const viajes = currentOrderData.viajes || [];
                const lineItems = currentOrderData.line_items || [];
                let subtotal = 0;

                viajes.forEach(v => {
                    if (v.tipo === 'interno') {
                        const input = document.getElementById(`trip-subtotal-${v.id}`);
                        subtotal += input ? (parseFloat(input.value) || 0) : 0;
                    } else {
                        const li = lineItems[v.item_index];
                        subtotal += li ? (parseFloat(li.subtotal) || 0) : (parseFloat(v.subtotal) || 0);
                    }
                });

                const metodo = document.getElementById('edit-payment-method').value;
                let cargos = 0;
                if (metodo !== 'Cash') {
                    cargos = subtotal * 0.05;
                }
                const total = subtotal + cargos;
                const statusViaje = document.getElementById('input-status-viaje').value;

                // Save cotización
                const payload = {
                    status_viaje: statusViaje,
                    subtotal: subtotal,
                    total: total,
                    payment_method_title: metodo
                };

                const res = await fetch(`${API_URL}?order_id=${currentOrderId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                // Save individual trip subtotals for internal trips
                for (const v of viajes) {
                    if (v.tipo === 'interno') {
                        const input = document.getElementById(`trip-subtotal-${v.id}`);
                        const tripSubtotal = input ? (parseFloat(input.value) || 0) : 0;
                        await fetch(`api/viajes_api.php?viaje_id=${v.id}`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ subtotal: tripSubtotal })
                        });
                    }
                }

                if (res.ok) {
                    closeModal();
                    loadOrders();
                } else {
                    alert('Error guardando');
                }
            } catch (e) {
                console.error(e);
                alert('Error de red');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '💾 Guardar Cambios';
            }
        };

        // Init
        loadOrders();
    </script>
</body>

</html>
